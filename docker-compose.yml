# A whole installation on one host: Caddy for TLS, Postgres, the API, the
# three front ends, and a toolbox container for migrations and backups.
#
#   cp .env.example .env    # then fill it in — it will not start without it
#   docker compose run --rm tools pnpm --filter @workspace/db run push
#   docker compose run --rm tools pnpm --filter @workspace/scripts run load-postal-codes
#   docker compose up -d
#
# Good enough for a pilot with a handful of homes on it. What it is not is a
# highly-available anything: one Postgres, one API, and the backups land on
# this host's disk until you copy them off it.

name: funeral-home

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-funeral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-funeral_home}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not published. Nothing outside this network has any business reaching
    # the database directly; reach it with `docker compose exec db psql`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-funeral} -d ${POSTGRES_DB:-funeral_home}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4311
      DATABASE_URL: postgres://${POSTGRES_USER:-funeral}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-funeral_home}
      # Refuses to start without this. Generate with:
      #   pnpm --filter @workspace/scripts run generate-encryption-key
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Caddy, then the app's nginx. Two hops is what makes the rate limiter
      # see each visitor's own address rather than Caddy's. Change it only if
      # you change what stands in front (see artifacts/api-server/src/lib/trust-proxy.ts).
      TRUST_PROXY_HOPS: 2
      # The three apps are same-origin with their own API through nginx, so no
      # cross-origin request needs allowing. Left settable for a separate dev
      # server pointed at this stack.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Who may reach the platform admin console, as a comma-separated list of
      # staff email addresses. Unset means nobody, which is the right default:
      # leaving this blank disables the console rather than opening it.
      #
      # TODO(C1): replaced by the `platform_admins` table once Component 1
      # lands, and this variable goes away with it.
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      FAMILY_PORTAL_URL: ${FAMILY_PORTAL_URL:?set FAMILY_PORTAL_URL in .env}
      CONSOLE_URL: ${CONSOLE_URL:?set CONSOLE_URL in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      SMS_DEFAULT_COUNTRY_CODE: ${SMS_DEFAULT_COUNTRY_CODE:-+1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      TASK_SECRET: ${TASK_SECRET:-}
    # Not published either: the only way in is through one of the two nginx
    # containers, which is what makes the cookie same-origin.

  family-portal:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP: family-portal
        VITE_FAMILY_PORTAL_URL: ${FAMILY_PORTAL_URL:-}
        VITE_CONSOLE_URL: ${CONSOLE_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    # Reached only through Caddy. Publishing this port as well would let a
    # client skip Caddy and forge the X-Forwarded-For the API trusts.
    expose:
      - "80"

  director-console:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP: director-console
        # So the Storefront screen shows the whole public-page address.
        VITE_FAMILY_PORTAL_URL: ${FAMILY_PORTAL_URL:-}
        VITE_CONSOLE_URL: ${CONSOLE_URL:-}
        # Sign-in sends a platform admin straight to their own console rather
        # than leaving them to remember a second hostname.
        VITE_ADMIN_CONSOLE_URL: ${ADMIN_CONSOLE_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    # Reached only through Caddy. Publishing this port as well would let a
    # client skip Caddy and forge the X-Forwarded-For the API trusts.
    expose:
      - "80"

  # The platform's own console — our staff, not a customer's. On its own
  # hostname like the others; it holds nothing a funeral home can reach, and
  # `PLATFORM_ADMIN_EMAILS` being empty is what keeps it shut.
  admin-console:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP: admin-console
        # So its sign-in can point a funeral director who opened the wrong
        # address at the one that is theirs.
        VITE_CONSOLE_URL: ${CONSOLE_URL:-}
        VITE_FAMILY_PORTAL_URL: ${FAMILY_PORTAL_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    # Reached only through Caddy. Publishing this port as well would let a
    # client skip Caddy and forge the X-Forwarded-For the API trusts.
    expose:
      - "80"

  # The public website, for funeral homes deciding whether to sign up. Optional
  # and off by default: it runs only with `--profile website` (or
  # COMPOSE_PROFILES=website in .env) and WEBSITE_URL set. It is the same
  # static build as the apps, with its own nginx config: no /api, and no
  # noindex header, because unlike them it exists to be found.
  #
  # Build-time only: the page is prerendered, so changing WEBSITE_URL or the
  # contact address means `docker compose build website`, not a restart.
  website:
    profiles: ["website"]
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP: website
        NGINX_CONF: deploy/website.conf.template
        NGINX_HEADERS: deploy/website-security-headers.conf
        VITE_SITE_URL: ${WEBSITE_URL:-}
        VITE_CONSOLE_URL: ${CONSOLE_URL:-}
        VITE_CONTACT_EMAIL: ${WEBSITE_CONTACT_EMAIL:-}
        VITE_PRIVACY_URL: ${WEBSITE_PRIVACY_URL:-}
        VITE_TERMS_URL: ${WEBSITE_TERMS_URL:-}
    restart: unless-stopped
    # Reached only through Caddy, like the apps.
    expose:
      - "80"

  # TLS, and the only container the internet can reach. Gets and renews a
  # certificate for each hostname by itself; see deploy/Caddyfile for what
  # has to be true (DNS, ports 80 and 443) before it can.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - family-portal
      - director-console
      - admin-console
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FAMILY_PORTAL_URL: ${FAMILY_PORTAL_URL:?set FAMILY_PORTAL_URL in .env}
      CONSOLE_URL: ${CONSOLE_URL:?set CONSOLE_URL in .env}
      ADMIN_CONSOLE_URL: ${ADMIN_CONSOLE_URL:?set ADMIN_CONSOLE_URL in .env}
      # Optional. Unset, the website block in the Caddyfile answers only a
      # plain-HTTP name under .invalid, which cannot resolve, so no certificate
      # is requested for it. The default is spelled out here as well as there
      # because compose would otherwise hand Caddy an empty string, and an
      # empty site address is a Caddyfile parse error.
      WEBSITE_URL: ${WEBSITE_URL:-http://website.invalid}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and the ACME account. Keep it: losing it means
      # re-issuing, and Let's Encrypt rate-limits that.
      - caddy-data:/data
      - caddy-config:/config

  # Not a server. `docker compose run --rm tools <command>` — migrations,
  # backups, restores, the ZIP centroid load, the aftercare send. It carries
  # the full workspace because drizzle-kit reads the schema as TypeScript and
  # every script runs through tsx.
  tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-funeral}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-funeral_home}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BACKUP_DIR: /backups
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FAMILY_PORTAL_URL: ${FAMILY_PORTAL_URL:-}
      CONSOLE_URL: ${CONSOLE_URL:-}
    volumes:
      # A named volume so backups survive `docker compose down`. It is still
      # on this host's disk, which is not a backup — copy it somewhere else.
      - backups:/backups

volumes:
  db-data:
  backups:
  caddy-data:
  caddy-config:
