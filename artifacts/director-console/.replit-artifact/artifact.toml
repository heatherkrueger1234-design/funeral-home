kind = "web"
previewPath = "/"
title = "Director Console"
version = "1.0.0"
id = "artifacts/director-console"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

# Funeral homes and the platform team both sign in here, at the root of
# continuumaftercare.com; a platform admin is forwarded to /admin on sign-in.
# Clients never come here: their texted link opens /family.
# "/" and not "/console", to agree with BASE_PATH below. `1cc8d06` merged two
# coherent designs into one that was neither: it took `paths`/`previewPath` from
# the branch that served this console at /console and `BASE_PATH` from the
# branch that served it at the root, leaving a bundle built for "/" and routed
# at "/console" — which resolves every script and stylesheet somewhere nothing
# is listening. `729ca85` shipped this exact layout, the console at "/" beside
# /api, /family and /admin, so the longest prefix wins and these three still
# take precedence over it.
[[services]]
name = "web"
paths = [ "/" ]
localPort = 21793

[services.development]
run = "pnpm --filter @workspace/director-console run dev"

[services.production]
publicDir = "artifacts/director-console/dist/public"
serve = "static"

# The bundle is built for the path it is served under, so the build has to be
# told it too; [services.env] alone is not guaranteed to reach the build step.
[services.production.build]
args = [ "pnpm", "--filter", "@workspace/director-console", "run", "build" ]

[services.production.build.env]
# Must match [services.env] below. Vite bakes this into the bundle, so when the
# two disagree it is this one that decides and the other that looks right —
# which is why the check script compares them rather than reading either alone.
BASE_PATH = "/"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21793"
VITE_FAMILY_PORTAL_URL = "https://continuumaftercare.com/family"
VITE_ADMIN_CONSOLE_URL = "https://continuumaftercare.com/admin"
# Must match [services.production.build.env] above and the `paths` this service
# is routed at; `scripts/src/check-artifact-paths.ts` fails the build if any of
# the three drift apart.
BASE_PATH = "/"
