kind = "web"
previewPath = "/"
title = "Director Console"
version = "1.0.0"
id = "artifacts/director-console"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21793

[services.development]
run = "pnpm --filter @workspace/director-console run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/director-console", "run", "build" ]
publicDir = "artifacts/director-console/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21793"
BASE_PATH = "/"
