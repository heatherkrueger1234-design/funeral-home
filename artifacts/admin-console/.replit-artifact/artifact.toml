kind = "web"
previewPath = "/admin/"
title = "Admin Console"
version = "1.0.0"
id = "artifacts/admin-console"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

# The platform's own console, at continuumaftercare.com/admin. Only addresses
# in the platform_admins table get past its sign-in; the API enforces that,
# not this path.
[[services]]
name = "web"
paths = [ "/admin" ]
localPort = 21794

[services.development]
run = "pnpm --filter @workspace/admin-console run dev"

[services.production]
publicDir = "artifacts/admin-console/dist/public"
serve = "static"

# Vite bakes the base path into the bundle, so the *build* has to be told it
# and not only the runtime: `[services.env]` alone is not guaranteed to reach
# the build step, and an admin console built for "/" and served at "/admin"
# resolves every asset and every link one level too high.
[services.production.build]
args = [ "pnpm", "--filter", "@workspace/admin-console", "run", "build" ]

[services.production.build.env]
BASE_PATH = "/admin"
# Vite bakes these in too, so they belong with the build rather than only in
# [services.env] below, which is not guaranteed to reach it. Without them a
# platform admin is not forwarded to /admin on sign-in, and the pointers
# between the three apps are left out of the bundle.
VITE_CONSOLE_URL = "https://continuumaftercare.com"
VITE_FAMILY_PORTAL_URL = "https://continuumaftercare.com/family"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21794"
BASE_PATH = "/admin"
VITE_CONSOLE_URL = "https://continuumaftercare.com"
VITE_FAMILY_PORTAL_URL = "https://continuumaftercare.com/family"
