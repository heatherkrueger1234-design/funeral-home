<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your funeral arrangements</title>
    <meta
      name="description"
      content="A private place to share photographs, details and questions with your funeral home."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Deliberately no Open Graph tags and no indexing. A link to this portal
      gets forwarded round a family by text message, and a preview card
      naming someone who has just died - or a search engine indexing it -
      would be a private grief made public by a detail nobody chose.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
