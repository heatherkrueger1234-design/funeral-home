kind = "web"
previewPath = "/family/"
title = "Family Portal"
version = "1.0.0"
id = "artifacts/family-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

# Clients only ever see this app. On Replit it shares continuumaftercare.com
# with the director console, so it lives under /family instead of fighting
# the console for "/". The API texts links built from FAMILY_PORTAL_URL (in
# api-server's artifact.toml), which has to agree with this path.
[[services]]
name = "web"
paths = [ "/family" ]
localPort = 21792

[services.development]
run = "pnpm --filter @workspace/family-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/family-portal", "run", "build" ]
publicDir = "artifacts/family-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21792"
BASE_PATH = "/family"
VITE_CONSOLE_URL = "https://continuumaftercare.com"
