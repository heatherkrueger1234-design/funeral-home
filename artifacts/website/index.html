    <title>Holding Today: the family portal for funeral homes</title>
    <!--
      Written for funeral home owners and directors, and only for them. The
      terms this page targets are the ones an operator searches for (family
      portal, photo collection, aftercare software); it deliberately does not
      use grief or bereavement language, so that a family searching in the
      worst week of their year does not land on a sales page.
    -->
    <meta
      name="description"
      content="Family portal software for funeral homes: one texted link per family for photo collection, the obituary and service details, one message thread, a dated timeline and aftercare check-ins, beside the case-management system you already use."
