kind = "web"
previewPath = "/"
title = "Holding Today"
version = "1.0.0"
id = "artifacts/holding-today"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21792

[services.development]
run = "pnpm --filter @workspace/holding-today run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/holding-today", "run", "build" ]
publicDir = "artifacts/holding-today/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21792"
BASE_PATH = "/"
