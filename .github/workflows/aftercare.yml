# The aftercare check-ins, on a schedule.
#
# The product's recurring value is that closing a case starts the grief
# check-ins and the home spends no staff hours on them. That only works if
# something actually fires, and for most of this product's life nothing did.
#
# This is the zero-infrastructure option: GitHub runs it, it makes one
# authenticated request, and the server does the work. A home on a platform
# with its own scheduler should use that instead — see docs in replit.md.
name: Aftercare

on:
  schedule:
    # Hourly. Each check-in falls due at mid-morning in the home's own time
    # zone, and the sender only sends between nine and seven there
    # (`isAftercareHour`), so an hourly run sends each one on its day, in
    # the morning, wherever the home is. Once a day at 14:00 UTC sent
    # anything due after two in the afternoon UTC a day late, and was six
    # in the morning on the Pacific coast. Off the hour, as GitHub asks.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Report what is due without sending anything"
        type: boolean
        default: false

concurrency:
  # The run is idempotent, but overlapping runs just waste a worker.
  group: aftercare
  cancel-in-progress: false

# No checkout, no push, no PR/issue access — just one authenticated curl.
permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      # Before the server exists there is nothing to call, and a job that goes
      # red every day for that trains everyone to ignore it. A scheduled run
      # skips with a notice; a hand-started run, or any run once the
      # REQUIRE_TASK_SECRETS repository variable is "true", fails instead.
      - name: Check there is a server to call
        id: config
        env:
          API_URL: ${{ secrets.API_URL }}
          TASK_SECRET: ${{ secrets.TASK_SECRET }}
          REQUIRED: ${{ github.event_name == 'workflow_dispatch' || vars.REQUIRE_TASK_SECRETS == 'true' }}
        run: |
          if [ -n "$API_URL" ] && [ -n "$TASK_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$REQUIRED" = "true" ]; then
            echo "::error::API_URL and TASK_SECRET must be set as repository secrets."
            exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: API_URL and TASK_SECRET are not set yet. Set the repository variable REQUIRE_TASK_SECRETS=true once deployed so a missing secret fails the run."
            echo "Skipped: no server configured yet (API_URL / TASK_SECRET unset)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Trigger the send
        if: steps.config.outputs.ready == 'true'
        env:
          API_URL: ${{ secrets.API_URL }}
          TASK_SECRET: ${{ secrets.TASK_SECRET }}
          DRY_RUN: ${{ inputs.dryRun && '1' || '0' }}
        run: |
          # --fail-with-body so a 4xx/5xx fails the job *and* prints why,
          # rather than failing silently on a schedule nobody is watching.
          curl --fail-with-body --silent --show-error \
            --max-time 600 \
            -X POST "${API_URL%/}/api/tasks/aftercare?dryRun=${DRY_RUN}" \
            -H "Authorization: Bearer ${TASK_SECRET}" \
            | tee result.json

          echo

          # A run that sends nothing is normal; a run that fails everything
          # it tried is not, and should page somebody rather than go green.
          python3 - <<'PY'
          import json, sys
          with open("result.json") as f:
              result = json.load(f)
          print(f"due={result['due']} sent={result['sent']} "
                f"failed={result['failed']} skipped={result['skipped']} "
                f"missed={result.get('missed', 0)}")
          if result["failed"] > 0 and result["sent"] == 0 and result["due"] > 0:
              sys.exit("Every check-in that was due failed to send.")
          PY
