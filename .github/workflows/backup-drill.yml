# Prove the backup restores, weekly, against a real Postgres.
#
# An untested backup is a belief, and the belief is only corrected on the day
# it matters. This runs the whole thing end to end — seed, dump, destroy,
# restore, compare — so a change that quietly breaks the dump is caught here
# rather than by a funeral home that has just lost a database of other
# people's photographs.
name: Backup drill

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  # Also on changes to the scripts themselves, since that is when it breaks.
  push:
    paths:
      - ".github/workflows/backup-drill.yml"
      - "scripts/src/backup-database.ts"
      - "scripts/src/backup-crypto.ts"
      - "scripts/src/restore-database.ts"
      - "scripts/src/verify-backup.ts"
      - "scripts/src/lib/backup-counts.ts"
      - "scripts/src/lib/dump-head.ts"
      - "scripts/src/lib/encrypted-columns.ts"
      - "lib/db/**"

# Checkout and a local Postgres service, nothing that writes back to GitHub.
permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drill
      VERIFY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drill_verify
      # Absolute, because `pnpm --filter` runs each script from inside
      # scripts/, and the steps below run from the checkout's root: relative
      # paths put the backup in one place and looked for it in another.
      BACKUP_DIR: ${{ github.workspace }}/backups
      # Standing in for the bucket: rclone treats a plain path as a local
      # disk, so the copy-off-the-host step runs for real, credentials aside.
      BACKUP_OFFSITE: ${{ github.workspace }}/offsite
      # Fixed test key. This is not, and must never become, a deployed secret.
      ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install postgres client and rclone
        # The runner image has psql, but pin the major so pg_dump and the
        # server agree — a newer server than client refuses to dump.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16 rclone
          psql --version
          rclone version

      - name: Create the schema and the scratch database
        run: |
          pnpm --filter @workspace/db run push-force
          psql "$DATABASE_URL" -c 'create database drill_verify' \
            || psql "${DATABASE_URL%/drill}/postgres" -c 'create database drill_verify'

      # One home, case, photograph and encrypted social security number: the
      # restore has to bring back rows, and verify-backup has to decrypt a
      # photograph and a number from what came back.
      - name: Seed something worth losing
        run: pnpm --filter @workspace/scripts run seed-demo -- --quiet

      - name: Back up, and copy it off the host
        run: pnpm --filter @workspace/scripts run backup-database

      # A database in use does not stop for a backup. Rows written after the
      # dump must not read as a broken backup: verify-backup holds the restore
      # to the counts taken with the dump, not to the database as it is now.
      - name: Keep writing after the dump, as a live database does
        run: pnpm --filter @workspace/scripts run seed-demo -- --quiet

      # The day this matters, the host and everything on its disk are gone.
      # So the copy on this disk is thrown away and the drill restores what
      # came back from the far side, the way somebody would at 3am.
      - name: Lose the host's copy, and fetch the offsite one
        run: |
          rm -rf "$BACKUP_DIR"
          test ! -e "$BACKUP_DIR"
          rclone copy "$BACKUP_OFFSITE" "$GITHUB_WORKSPACE/from-offsite"
          ls -la "$GITHUB_WORKSPACE/from-offsite"

      - name: Verify the offsite copy restores
        env:
          BACKUP_DIR: ${{ github.workspace }}/from-offsite
        run: pnpm --filter @workspace/scripts run verify-backup

      # A check that cannot fail proves nothing.
      - name: Refuse the same copy under a key that is not its own
        env:
          BACKUP_DIR: ${{ github.workspace }}/from-offsite
          # Any other 32 bytes; these are thirty-two 0x08s. Not a secret.
          ENCRYPTION_KEY: CAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg=
        run: |
          if pnpm --filter @workspace/scripts run verify-backup; then
            echo "::error::verify-backup passed a backup under the wrong ENCRYPTION_KEY"
            exit 1
          fi
