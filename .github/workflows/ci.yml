name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only checkout and a build/test run — this job never pushes, comments,
# or touches issues/PRs, so the default (broader) GITHUB_TOKEN scope has
# nothing to do here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: funeral_home_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/funeral_home_test
      # Fixed test key. This is not, and must never become, a deployed secret.
      ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Check the generated API client is in step with the spec
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code -- lib/api-zod lib/api-client-react

      - name: Build
        run: pnpm run build
        env:
          # The Vite configs require these; the values only affect the dev
          # server and the base path, neither of which matters to a build.
          PORT: 3000
          BASE_PATH: /

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: funeral_home_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser Playwright pins in artifacts/e2e-tests
        run: pnpm --filter @workspace/e2e-tests exec playwright install --with-deps chromium

      # webServer in playwright.config.ts builds and starts api-server,
      # family-portal and director-console itself, so this job needs nothing
      # already built — it is the one CI job that renders an actual page.
      - name: Run the browser suite
        run: pnpm --filter @workspace/e2e-tests run test:e2e
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/funeral_home_e2e
          # No ENCRYPTION_KEY here, deliberately. Unlike the other jobs, this
          # one starts the API with NODE_ENV=production, and `lib/db/crypto.ts`
          # refuses the fixed public key in production — correctly, since it is
          # in version control. playwright.config.ts generates a fresh key per
          # run instead; the database is created fresh, so no ciphertext
          # outlives it. Setting it here is what kept this job red.

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/e2e-tests/playwright-report/
          retention-days: 14
