    # -------------------------------------------------------------- family --

    FamilySession:
      type: object
      description: |
        Everything the family portal needs on first load, in one call - the
        portal is opened on a phone, on mobile data, at a kitchen table, and
        four round trips before anything renders is four chances to look
        broken.
      properties:
        contact:
          $ref: "#/components/schemas/FamilyContact"
        home:
          $ref: "#/components/schemas/PublicFuneralHome"
        case:
          $ref: "#/components/schemas/Case"
        leadDirector:
          oneOf:
            - $ref: "#/components/schemas/StaffSignature"
            - type: "null"
        photoCount:
          type: integer
        photoLimit:
          type: integer
        selectedPhotoCount:
          type: integer
        slideshowTarget:
          type: integer
          description: A recommendation for a watchable slideshow, never enforced.
        obituaryStatus:
          type: string
          enum: [family_draft, submitted, approved]
        outstandingDeadlines:
          type: integer
        unreadMessages:
          type: integer
        messagesLocked:
          type: boolean
        aftercare:
          oneOf:
            - $ref: "#/components/schemas/AftercareEnrollment"
            - type: "null"
      required:
        [
          contact,
          home,
          case,
          leadDirector,
          photoCount,
          photoLimit,
          selectedPhotoCount,
          slideshowTarget,
          obituaryStatus,
          outstandingDeadlines,
          unreadMessages,
          messagesLocked,
          aftercare,
        ]
