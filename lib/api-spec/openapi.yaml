          nullable: true
        residenceCity:
          type: string
          nullable: true
        residenceCounty:
          type: string
          nullable: true
        residenceState:
          type: string
          nullable: true
        residencePostalCode:
          type: string
          nullable: true
        veteranBranch:
          type: string
          nullable: true
        veteranServiceDates:
          type: string
          nullable: true
        veteranDischargeDocument:
          type: string
          nullable: true
        dispositionType:
          type: string
          nullable: true
        dispositionPlace:
          type: string
          nullable: true
