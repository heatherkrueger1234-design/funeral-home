openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: |
    Holding Today for funeral homes - the calm, private portal a home gives a
    family, and the console the director works it from.

    Two audiences, two authentication schemes, and the split is load-bearing:

    - **Staff** sign in and carry a session cookie. Their funeral home is read
      off their user row; a home id arriving in a request is never trusted.
    - **Families** have no account. They arrive through a link that was texted
      to them and send its token as `Authorization: Bearer <token>`. Every one
      of their endpoints lives under `/family` and is scoped to the single
      case that token belongs to - there is no case id in any of those paths,
      because there is no case they could ask for other than their own.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Liveness
  - name: auth
    description: Staff accounts and sessions
  - name: home
    description: The funeral home's own settings and branding
  - name: cases
    description: Cases - one death, and the work around it
  - name: contacts
    description: The family's people, and their links
  - name: photos
    description: The photo bin
  - name: obituary
    description: The obituary draft
  - name: selections
    description: Hymns, readings, pallbearers
  - name: messages
    description: The one thread per case
  - name: deadlines
    description: What is due, and when
  - name: aftercare
    description: Branded grief check-ins after the service
  - name: uploads
    description: Serving stored bytes
  - name: family
    description: Everything the family-facing portal calls

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ------------------------------------------------------------------ auth --

  /auth/register:
    post:
      operationId: registerHome
      tags: [auth]
      summary: Open an account, creating the funeral home and its first owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out on this device
      responses:
        "204":
          description: Signed out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Who is signed in, and which home they work at
      responses:
        "200":
          description: The signed-in staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Send a reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "202":
          description: Accepted, whether or not the address is known

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password from a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "204":
          description: Password changed and other sessions ended

  # ------------------------------------------------------------------ home --

  /home:
    get:
      operationId: getHome
      tags: [home]
      summary: The signed-in staff member's funeral home
      responses:
        "200":
          description: The home
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuneralHome"
    put:
      operationId: updateHome
      tags: [home]
      summary: Update branding, hours and contact details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FuneralHomeUpdate"
      responses:
        "200":
          description: The updated home
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuneralHome"

  /home/staff:
    get:
      operationId: getStaff
      tags: [home]
      summary: Everyone who works cases at this home
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: inviteStaff
      tags: [home]
      summary: Add a colleague, and send them a link to set a password
      description: |
        Owner only. The account is created with no password; the invitee sets
        one through the ordinary reset link, so a password is never typed by
        one person on behalf of another and never travels in an email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInviteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMemberWithInvite"

  /home/staff/{userId}:
    put:
      operationId: updateStaff
      tags: [home]
      summary: Change a colleague's role, or take their access away
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /home/timeline-template:
    get:
      operationId: getTimelineTemplate
      tags: [home]
      summary: The home's standard schedule, as offsets from the service
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineTemplate"
    post:
      operationId: createTimelineTemplate
      tags: [home]
      summary: Add a step to the standard schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineTemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineTemplate"

  /home/timeline-template/{templateId}:
    put:
      operationId: updateTimelineTemplate
      tags: [home]
      summary: Edit a step
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineTemplateUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineTemplate"
    delete:
      operationId: deleteTimelineTemplate
      tags: [home]
      summary: Remove a step
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /cases/{caseId}/deadlines/from-template:
    post:
      operationId: applyTimelineTemplate
      tags: [deadlines]
      summary: Build this case's schedule from the home's standard one
      description: |
        Needs a service date, because every step is an offset from it. Steps
        already on the timeline are matched by title and left alone, so this
        is safe to run twice and safe to run after the service date moves.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The rebuilt timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseDeadline"

  # ----------------------------------------------------------------- cases --

  /cases:
    get:
      operationId: getCases
      tags: [cases]
      summary: The home's cases, soonest service first
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [intake, active, closed]
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseSummary"
    post:
      operationId: createCase
      tags: [cases]
      summary: Open a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"

  /cases/{caseId}:
    get:
      operationId: getCase
      tags: [cases]
      summary: One case, with everything the director needs at a glance
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
    put:
      operationId: updateCase
      tags: [cases]
      summary: Update the person, the service, or the lead director
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"

  /cases/{caseId}/close:
    post:
      operationId: closeCase
      tags: [cases]
      summary: Close the case, lock the thread, and hand the family to aftercare
      description: |
        The commercially important endpoint. Closing sets the date the chat
        locks (a fortnight after the service) and, when the home has aftercare
        switched on, creates a pending enrolment for every family contact who
        left an address. Enrolments stay `pending` until the family consents.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The closed case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"

  # -------------------------------------------------------------- contacts --

  /cases/{caseId}/contacts:
    get:
      operationId: getCaseContacts
      tags: [contacts]
      summary: The family's people on this case
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FamilyContact"
    post:
      operationId: createCaseContact
      tags: [contacts]
      summary: Add a family member and mint their link
      description: |
        The only time the working link is ever returned. It is shown once, for
        the director to paste into a text message, and cannot be retrieved
        afterwards - only the digest is stored.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyContactInput"
      responses:
        "201":
          description: Created, with the one-time link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyContactWithLink"

  /contacts/{contactId}:
    put:
      operationId: updateContact
      tags: [contacts]
      summary: Correct a name, number or role
      parameters:
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyContactUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyContact"
    delete:
      operationId: revokeContact
      tags: [contacts]
      summary: Revoke this person's link
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "204":
          description: Revoked

  /contacts/{contactId}/send-link:
    post:
      operationId: sendContactLink
      tags: [contacts]
      summary: Text a fresh link to this person's mobile
      description: |
        Mints a new link and sends it, so the previous one stops working. The
        response says whether the text actually went; where the home has no
        SMS credentials it returns the link and `sent: false` so the director
        can send it themselves rather than being told nothing happened.
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: Minted, and sent if possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentLink"

  /contacts/{contactId}/link:
    post:
      operationId: reissueContactLink
      tags: [contacts]
      summary: Mint a fresh link, invalidating the old one
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: The new one-time link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyContactWithLink"

  # ---------------------------------------------------- staff: the asset drop

  /cases/{caseId}/photos:
    get:
      operationId: getCasePhotos
      tags: [photos]
      summary: Every photograph on the case, in slideshow order
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CasePhoto"

  /cases/{caseId}/photos/order:
    put:
      operationId: reorderCasePhotos
      tags: [photos]
      summary: Set the slideshow order
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoOrderInput"
      responses:
        "200":
          description: The reordered list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CasePhoto"

  /photos/{photoId}:
    patch:
      operationId: updatePhoto
      tags: [photos]
      summary: Caption, crop, or hide a photograph
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePhoto"
    delete:
      operationId: deletePhoto
      tags: [photos]
      summary: Remove a photograph entirely
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "204":
          description: Deleted

  /cases/{caseId}/photo-pack:
    get:
      operationId: getPhotoPack
      tags: [photos]
      summary: Download the photographs as a numbered folder, in slideshow order
      description: |
        A ZIP the director can drop straight into slideshow software: files
        numbered in the order they will be shown, named with the caption the
        family wrote, plus a `captions.txt` for the order of service. Hidden
        photographs are left out.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The pack
          content:
            application/zip:
              schema:
                type: string
                format: binary

  /cases/{caseId}/obituary:
    get:
      operationId: getObituary
      tags: [obituary]
      summary: The obituary draft and its fields
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryDraft"
    put:
      operationId: updateObituary
      tags: [obituary]
      summary: Edit the fields or the composed text
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObituaryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryDraft"

  /cases/{caseId}/obituary/compose:
    post:
      operationId: composeObituary
      tags: [obituary]
      summary: Recompose the draft text from the fields
      description: |
        Overwrites `draftText`. Refused once staff have hand-edited the text
        unless `force` is set, so that regenerating cannot silently discard a
        director's rewrite.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeObituaryInput"
      responses:
        "200":
          description: Recomposed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryDraft"

  /cases/{caseId}/obituary/approve:
    post:
      operationId: approveObituary
      tags: [obituary]
      summary: Sign the obituary off for print
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryDraft"

  /cases/{caseId}/selections:
    get:
      operationId: getSelections
      tags: [selections]
      summary: Hymns, readings, music, pallbearers
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceSelection"
    post:
      operationId: createSelection
      tags: [selections]
      summary: Add a selection
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceSelection"

  /selections/{selectionId}:
    put:
      operationId: updateSelection
      tags: [selections]
      summary: Edit or confirm a selection
      parameters:
        - $ref: "#/components/parameters/SelectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceSelection"
    delete:
      operationId: deleteSelection
      tags: [selections]
      summary: Remove a selection
      parameters:
        - $ref: "#/components/parameters/SelectionId"
      responses:
        "204":
          description: Deleted

  /cases/{caseId}/messages:
    get:
      operationId: getCaseMessages
      tags: [messages]
      summary: The thread, oldest first
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageThread"
    post:
      operationId: postCaseMessage
      tags: [messages]
      summary: Reply to the family
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMessage"

  /cases/{caseId}/deadlines:
    get:
      operationId: getDeadlines
      tags: [deadlines]
      summary: The timeline, soonest first
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseDeadline"
    post:
      operationId: createDeadline
      tags: [deadlines]
      summary: Add something due, or an event
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeadlineInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDeadline"

  /deadlines/{deadlineId}:
    put:
      operationId: updateDeadline
      tags: [deadlines]
      summary: Edit, complete or reopen
      parameters:
        - $ref: "#/components/parameters/DeadlineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeadlineUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDeadline"
    delete:
      operationId: deleteDeadline
      tags: [deadlines]
      summary: Remove a timeline entry
      parameters:
        - $ref: "#/components/parameters/DeadlineId"
      responses:
        "204":
          description: Deleted

  /cases/{caseId}/aftercare:
    get:
      operationId: getAftercare
      tags: [aftercare]
      summary: Who is enrolled, and what has gone out
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AftercareEnrollment"

  /uploads:
    post:
      operationId: uploadFile
      tags: [uploads]
      summary: Store bytes (the home's logo, or a staff-added photograph)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSummary"

  /uploads/{uploadId}:
    get:
      operationId: getUpload
      tags: [uploads]
      summary: Serve stored bytes
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ---------------------------------------------------------------- family --
  #
  # Everything below is reached with the link token, not a session. None of
  # these paths carry a case id: the token names exactly one case, and a
  # family member has no other case they could be asking for. That is what
  # makes the whole surface safe to expose to an unauthenticated stranger
  # holding a forwarded text message.

  /family/session:
    get:
      operationId: getFamilySession
      tags: [family]
      summary: Who this link belongs to, and everything needed to draw the portal
      description: |
        The first call the portal makes. Returns the home (for branding and
        the urgent number), the person who died, the service details, what is
        outstanding, and the contact the link identifies. A revoked, expired
        or unknown token is a 401 here and the portal shows the "ask the home
        for a new link" screen.
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilySession"

  /family/photos:
    get:
      operationId: getFamilyPhotos
      tags: [family]
      summary: The photographs uploaded so far
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CasePhoto"
    post:
      operationId: uploadFamilyPhoto
      tags: [family]
      summary: Add a photograph to the bin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FamilyPhotoUploadInput"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePhoto"

  /family/photos/{photoId}:
    patch:
      operationId: updateFamilyPhoto
      tags: [family]
      summary: Caption a photograph, or set its portrait crop
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyPhotoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePhoto"
    delete:
      operationId: deleteFamilyPhoto
      tags: [family]
      summary: Remove a photograph this family uploaded
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "204":
          description: Deleted

  /family/portrait:
    put:
      operationId: setFamilyPortrait
      tags: [family]
      summary: Choose the main portrait
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortraitInput"
      responses:
        "200":
          description: The chosen photograph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePhoto"

  /family/obituary:
    get:
      operationId: getFamilyObituary
      tags: [family]
      summary: The obituary form as the family left it
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryDraft"
    put:
      operationId: updateFamilyObituary
      tags: [family]
      summary: Save the obituary fields
      description: |
        Refused once the director has approved the obituary for print, so that
        a well-meaning relative cannot change the text after it has gone to
        the printer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObituaryFieldsInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryDraft"

  /family/obituary/submit:
    post:
      operationId: submitFamilyObituary
      tags: [family]
      summary: Hand the obituary to the director
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryDraft"

  /family/selections:
    get:
      operationId: getFamilySelections
      tags: [family]
      summary: Hymns, readings and pallbearers chosen so far
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceSelection"
    post:
      operationId: createFamilySelection
      tags: [family]
      summary: Add a hymn, reading, or pallbearer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceSelection"

  /family/selections/{selectionId}:
    delete:
      operationId: deleteFamilySelection
      tags: [family]
      summary: Remove a selection the director has not confirmed
      parameters:
        - $ref: "#/components/parameters/SelectionId"
      responses:
        "204":
          description: Deleted

  /family/messages:
    get:
      operationId: getFamilyMessages
      tags: [family]
      summary: The thread with the funeral home
      responses:
        "200":
          description: The thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageThread"
    post:
      operationId: postFamilyMessage
      tags: [family]
      summary: Ask the director something
      description: |
        Always delivered, whatever the hour. When it is sent outside the
        home's office hours the response says so, so the portal can tell the
        family plainly when it will be read and offer the 24-hour line - which
        is a truthful thing to say, unlike holding the message back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMessage"

  /family/deadlines:
    get:
      operationId: getFamilyDeadlines
      tags: [family]
      summary: What is due, and when the service is
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseDeadline"

  /family/deadlines/{deadlineId}:
    post:
      operationId: completeFamilyDeadline
      tags: [family]
      summary: Mark something done, or undo that
      parameters:
        - $ref: "#/components/parameters/DeadlineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteDeadlineInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDeadline"

  /family/aftercare:
    post:
      operationId: setFamilyAftercareConsent
      tags: [family]
      summary: Accept or decline the grief check-ins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AftercareConsentInput"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AftercareEnrollment"

  /family/uploads/{uploadId}:
    get:
      operationId: getFamilyUpload
      tags: [family]
      summary: Serve a photograph on this case, or the home's logo
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

components:
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: integer
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: integer
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: integer
    SelectionId:
      name: selectionId
      in: path
      required: true
      schema:
        type: integer
    DeadlineId:
      name: deadlineId
      in: path
      required: true
      schema:
        type: integer
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ---------------------------------------------------------------- auth --

    RegisterInput:
      type: object
      properties:
        homeName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        displayName:
          type: string
          nullable: true
      required: [homeName, email, password]

    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    ForgotPasswordInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ResetPasswordInput:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 10
      required: [token, password]

    StaffMember:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        displayName:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, director, staff]
        deactivatedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, email, displayName, title, role, deactivatedAt]

    TimelineTemplate:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        offsetMinutes:
          type: integer
          description: Relative to the service. Negative is before it.
        offsetLabel:
          type: string
          description: The offset in words, e.g. "3 days before".
        isEvent:
          type: boolean
        enabled:
          type: boolean
        position:
          type: integer
      required:
        [id, title, description, offsetMinutes, offsetLabel, isEvent, enabled, position]

    TimelineTemplateInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        offsetMinutes:
          type: integer
        isEvent:
          type: boolean
      required: [title, offsetMinutes]

    TimelineTemplateUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        offsetMinutes:
          type: integer
        isEvent:
          type: boolean
        enabled:
          type: boolean
        position:
          type: integer

    StaffInviteInput:
      type: object
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, director, staff]
      required: [email]

    StaffMemberWithInvite:
      description: |
        Returned once, when a colleague is added. `inviteLink` is shown to the
        owner so they can pass it on if the email does not arrive; it is the
        ordinary single-use password-reset link and is never retrievable again.
      allOf:
        - $ref: "#/components/schemas/StaffMember"
        - type: object
          properties:
            inviteLink:
              type: string
          required: [inviteLink]

    StaffUpdate:
      type: object
      properties:
        displayName:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, director, staff]
        active:
          type: boolean
          description: False takes their access away without deleting their history.

    AuthUser:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/StaffMember"
        home:
          $ref: "#/components/schemas/FuneralHome"
      required: [user, home]

    # ---------------------------------------------------------------- home --

    FuneralHome:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        logoUploadId:
          type: integer
          nullable: true
        accentColor:
          type: string
        phone:
          type: string
          nullable: true
        urgentPhone:
          type: string
          nullable: true
        addressLine1:
          type: string
          nullable: true
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        officeOpensMinute:
          type: integer
        officeClosesMinute:
          type: integer
        timezone:
          type: string
        aftercareEnabled:
          type: boolean
        aftercareSenderName:
          type: string
          nullable: true
        subscriptionStatus:
          type: string
          enum: [trial, active, past_due, canceled]
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
      required:
        [
          id,
          name,
          slug,
          logoUploadId,
          accentColor,
          phone,
          urgentPhone,
          officeOpensMinute,
          officeClosesMinute,
          timezone,
          aftercareEnabled,
          subscriptionStatus,
        ]

    FuneralHomeUpdate:
      type: object
      properties:
        name:
          type: string
        logoUploadId:
          type: integer
          nullable: true
        accentColor:
          type: string
        phone:
          type: string
          nullable: true
        urgentPhone:
          type: string
          nullable: true
        addressLine1:
          type: string
          nullable: true
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        officeOpensMinute:
          type: integer
          minimum: 0
          maximum: 1439
        officeClosesMinute:
          type: integer
          minimum: 0
          maximum: 1439
        timezone:
          type: string
        aftercareEnabled:
          type: boolean
        aftercareSenderName:
          type: string
          nullable: true

    # ------------------------------------------------------- what a family sees

    PublicFuneralHome:
      type: object
      description: The home as a family may see it - branding and how to reach it.
      properties:
        name:
          type: string
        slug:
          type: string
        accentColor:
          type: string
        logoUploadId:
          type: integer
          nullable: true
        phone:
          type: string
          nullable: true
        urgentPhone:
          type: string
          nullable: true
        officeOpensMinute:
          type: integer
        officeClosesMinute:
          type: integer
        timezone:
          type: string
      required:
        [
          name,
          slug,
          accentColor,
          logoUploadId,
          phone,
          urgentPhone,
          officeOpensMinute,
          officeClosesMinute,
          timezone,
        ]

    StaffSignature:
      type: object
      description: A staff member as a family sees them - a name and a title.
      properties:
        displayName:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
      required: [displayName, title]

    # --------------------------------------------------------------- cases --

    Case:
      type: object
      properties:
        id:
          type: integer
        decedentFirstName:
          type: string
        decedentLastName:
          type: string
        decedentPreferredName:
          type: string
          nullable: true
        displayName:
          type: string
        dateOfBirth:
          type: string
          format: date-time
          nullable: true
        dateOfDeath:
          type: string
          format: date-time
          nullable: true
        portraitPhotoId:
          type: integer
          nullable: true
        serviceAt:
          type: string
          format: date-time
          nullable: true
        serviceLocation:
          type: string
          nullable: true
        serviceNotes:
          type: string
          nullable: true
        leadDirectorId:
          type: integer
          nullable: true
        status:
          type: string
          enum: [intake, active, closed]
        closedAt:
          type: string
          format: date-time
          nullable: true
        messagesLockAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        [
          id,
          decedentFirstName,
          decedentLastName,
          decedentPreferredName,
          displayName,
          dateOfBirth,
          dateOfDeath,
          portraitPhotoId,
          serviceAt,
          serviceLocation,
          serviceNotes,
          leadDirectorId,
          status,
          closedAt,
          messagesLockAt,
          createdAt,
        ]

    CaseSummary:
      description: |
        A case as it appears in the director's list. The counts are what turn
        the list into a worklist: they answer "which family is behind" without
        opening anything.
      allOf:
        - $ref: "#/components/schemas/Case"
        - type: object
          properties:
            photoCount:
              type: integer
            unreadFamilyMessages:
              type: integer
            outstandingDeadlines:
              type: integer
            obituaryStatus:
              type: string
              enum: [family_draft, submitted, approved]
            nextOfKinName:
              type: string
              nullable: true
          required:
            [
              photoCount,
              unreadFamilyMessages,
              outstandingDeadlines,
              obituaryStatus,
              nextOfKinName,
            ]

    CaseDetail:
      allOf:
        - $ref: "#/components/schemas/CaseSummary"
        - type: object
          properties:
            leadDirector:
              oneOf:
                - $ref: "#/components/schemas/StaffSignature"
                - type: "null"
            contacts:
              type: array
              items:
                $ref: "#/components/schemas/FamilyContact"
          required: [leadDirector, contacts]

    CaseInput:
      type: object
      properties:
        decedentFirstName:
          type: string
          minLength: 1
        decedentLastName:
          type: string
          minLength: 1
        decedentPreferredName:
          type: string
          nullable: true
        dateOfBirth:
          type: string
          format: date-time
          nullable: true
        dateOfDeath:
          type: string
          format: date-time
          nullable: true
        serviceAt:
          type: string
          format: date-time
          nullable: true
        serviceLocation:
          type: string
          nullable: true
        leadDirectorId:
          type: integer
          nullable: true
      required: [decedentFirstName, decedentLastName]

    CaseUpdate:
      type: object
      properties:
        decedentFirstName:
          type: string
          minLength: 1
        decedentLastName:
          type: string
          minLength: 1
        decedentPreferredName:
          type: string
          nullable: true
        dateOfBirth:
          type: string
          format: date-time
          nullable: true
        dateOfDeath:
          type: string
          format: date-time
          nullable: true
        portraitPhotoId:
          type: integer
          nullable: true
        serviceAt:
          type: string
          format: date-time
          nullable: true
        serviceLocation:
          type: string
          nullable: true
        serviceNotes:
          type: string
          nullable: true
        leadDirectorId:
          type: integer
          nullable: true
        status:
          type: string
          enum: [intake, active, closed]
        messagesLockAt:
          type: string
          format: date-time
          nullable: true

    # ------------------------------------------------------------ contacts --

    FamilyContact:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: integer
        name:
          type: string
        relationship:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [next_of_kin, contributor]
        canInvite:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        firstSeenAt:
          type: string
          format: date-time
          nullable: true
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        [
          id,
          caseId,
          name,
          relationship,
          phone,
          email,
          role,
          canInvite,
          expiresAt,
          revokedAt,
          firstSeenAt,
          lastSeenAt,
          createdAt,
        ]

    FamilyContactWithLink:
      description: |
        Returned only at the moment a link is minted. `link` is the working
        URL to paste into a text message and is never retrievable again -
        only its digest is stored.
      allOf:
        - $ref: "#/components/schemas/FamilyContact"
        - type: object
          properties:
            link:
              type: string
          required: [link]

    SentLink:
      allOf:
        - $ref: "#/components/schemas/FamilyContactWithLink"
        - type: object
          properties:
            sent:
              type: boolean
            smsError:
              type: string
              nullable: true
              description: Why the text did not go, in words a director can act on.
          required: [sent, smsError]

    FamilyContactInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        relationship:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [next_of_kin, contributor]
        canInvite:
          type: boolean
      required: [name]

    FamilyContactUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        relationship:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [next_of_kin, contributor]
        canInvite:
          type: boolean

    # -------------------------------------------------------------- photos --

    CasePhoto:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: integer
        uploadId:
          type: integer
        uploadedByContactId:
          type: integer
          nullable: true
        uploadedByName:
          type: string
          nullable: true
          description: Who sent it, resolved for display. Null when staff added it.
        caption:
          type: string
          nullable: true
        cropX:
          type: number
          nullable: true
        cropY:
          type: number
          nullable: true
        cropWidth:
          type: number
          nullable: true
        cropHeight:
          type: number
          nullable: true
        position:
          type: integer
        status:
          type: string
          enum: [visible, hidden]
        isPortrait:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        [
          id,
          caseId,
          uploadId,
          uploadedByContactId,
          uploadedByName,
          caption,
          cropX,
          cropY,
          cropWidth,
          cropHeight,
          position,
          status,
          isPortrait,
          createdAt,
        ]

    PhotoUpdate:
      type: object
      properties:
        caption:
          type: string
          nullable: true
        status:
          type: string
          enum: [visible, hidden]
        cropX:
          type: number
          minimum: 0
          maximum: 1
        cropY:
          type: number
          minimum: 0
          maximum: 1
        cropWidth:
          type: number
          minimum: 0
          maximum: 1
        cropHeight:
          type: number
          minimum: 0
          maximum: 1

    FamilyPhotoUpdate:
      type: object
      properties:
        caption:
          type: string
          nullable: true
        cropX:
          type: number
          minimum: 0
          maximum: 1
        cropY:
          type: number
          minimum: 0
          maximum: 1
        cropWidth:
          type: number
          minimum: 0
          maximum: 1
        cropHeight:
          type: number
          minimum: 0
          maximum: 1

    PhotoOrderInput:
      type: object
      properties:
        photoIds:
          type: array
          items:
            type: integer
      required: [photoIds]

    PortraitInput:
      type: object
      properties:
        photoId:
          type: integer
        cropX:
          type: number
          minimum: 0
          maximum: 1
        cropY:
          type: number
          minimum: 0
          maximum: 1
        cropWidth:
          type: number
          minimum: 0
          maximum: 1
        cropHeight:
          type: number
          minimum: 0
          maximum: 1
      required: [photoId]

    UploadInput:
      type: object
      properties:
        file:
          type: string
          format: binary
      required: [file]

    FamilyPhotoUploadInput:
      type: object
      properties:
        file:
          type: string
          format: binary
        caption:
          type: string
      required: [file]

    UploadSummary:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, filename, mimeType, sizeBytes, createdAt]

    # ------------------------------------------------------------ obituary --

    ObituaryDraft:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: integer
        fullName:
          type: string
          nullable: true
        bornOn:
          type: string
          nullable: true
        birthPlace:
          type: string
          nullable: true
        diedOn:
          type: string
          nullable: true
        deathPlace:
          type: string
          nullable: true
        survivedBy:
          type: string
          nullable: true
        precededBy:
          type: string
          nullable: true
        biography:
          type: string
          nullable: true
        inLieuOfFlowers:
          type: string
          nullable: true
        specialThanks:
          type: string
          nullable: true
        draftText:
          type: string
          nullable: true
        draftEditedByStaff:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [family_draft, submitted, approved]
        submittedAt:
          type: string
          format: date-time
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
      required:
        [
          id,
          caseId,
          fullName,
          bornOn,
          birthPlace,
          diedOn,
          deathPlace,
          survivedBy,
          precededBy,
          biography,
          inLieuOfFlowers,
          specialThanks,
          draftText,
          draftEditedByStaff,
          status,
          submittedAt,
          approvedAt,
          updatedAt,
        ]

    ObituaryFieldsInput:
      type: object
      properties:
        fullName:
          type: string
          nullable: true
        bornOn:
          type: string
          nullable: true
        birthPlace:
          type: string
          nullable: true
        diedOn:
          type: string
          nullable: true
        deathPlace:
          type: string
          nullable: true
        survivedBy:
          type: string
          nullable: true
        precededBy:
          type: string
          nullable: true
        biography:
          type: string
          nullable: true
        inLieuOfFlowers:
          type: string
          nullable: true
        specialThanks:
          type: string
          nullable: true

    ObituaryUpdate:
      allOf:
        - $ref: "#/components/schemas/ObituaryFieldsInput"
        - type: object
          properties:
            draftText:
              type: string
              nullable: true

    ComposeObituaryInput:
      type: object
      properties:
        force:
          type: boolean
          description: Recompose even though staff have hand-edited the text.

    # ---------------------------------------------------------- selections --

    ServiceSelection:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: integer
        kind:
          type: string
          enum: [hymn, reading, music, pallbearer, eulogist, other]
        value:
          type: string
        notes:
          type: string
          nullable: true
        attribution:
          type: string
          nullable: true
        position:
          type: integer
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        [id, caseId, kind, value, notes, attribution, position, confirmedAt, createdAt]

    SelectionInput:
      type: object
      properties:
        kind:
          type: string
          enum: [hymn, reading, music, pallbearer, eulogist, other]
        value:
          type: string
          minLength: 1
        notes:
          type: string
          nullable: true
        attribution:
          type: string
          nullable: true
      required: [kind, value]

    SelectionUpdate:
      type: object
      properties:
        kind:
          type: string
          enum: [hymn, reading, music, pallbearer, eulogist, other]
        value:
          type: string
          minLength: 1
        notes:
          type: string
          nullable: true
        attribution:
          type: string
          nullable: true
        position:
          type: integer
        confirmed:
          type: boolean

    # ------------------------------------------------------------ messages --

    CaseMessage:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: integer
        body:
          type: string
        authorSide:
          type: string
          enum: [home, family]
          description: |
            Which side wrote it, derived on the server from which author
            column is set rather than stored, so the two cannot disagree.
        authorName:
          type: string
          nullable: true
        authorTitle:
          type: string
          nullable: true
        sentOutsideOfficeHours:
          type: boolean
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        [
          id,
          caseId,
          body,
          authorSide,
          authorName,
          authorTitle,
          sentOutsideOfficeHours,
          readAt,
          createdAt,
        ]

    MessageThread:
      type: object
      description: |
        The thread plus the state the UI needs to say something honest about
        it: whether it is locked, and whether a message written now would land
        outside office hours.
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CaseMessage"
        locked:
          type: boolean
        lockedAt:
          type: string
          format: date-time
          nullable: true
        withinOfficeHours:
          type: boolean
        officeOpensMinute:
          type: integer
        officeClosesMinute:
          type: integer
        timezone:
          type: string
        urgentPhone:
          type: string
          nullable: true
      required:
        [
          messages,
          locked,
          lockedAt,
          withinOfficeHours,
          officeOpensMinute,
          officeClosesMinute,
          timezone,
          urgentPhone,
        ]

    MessageInput:
      type: object
      properties:
        body:
          type: string
          minLength: 1
      required: [body]

    # ----------------------------------------------------------- deadlines --

    CaseDeadline:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        dueAt:
          type: string
          format: date-time
        isEvent:
          type: boolean
        completedAt:
          type: string
          format: date-time
          nullable: true
        completedByName:
          type: string
          nullable: true
        position:
          type: integer
      required:
        [id, caseId, title, description, dueAt, isEvent, completedAt, completedByName, position]

    DeadlineInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        dueAt:
          type: string
          format: date-time
        isEvent:
          type: boolean
      required: [title, dueAt]

    DeadlineUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        dueAt:
          type: string
          format: date-time
        isEvent:
          type: boolean
        completed:
          type: boolean
        position:
          type: integer

    CompleteDeadlineInput:
      type: object
      properties:
        completed:
          type: boolean
      required: [completed]

    # ----------------------------------------------------------- aftercare --

    AftercareEnrollment:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: integer
        contactId:
          type: integer
        contactName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        brandedAs:
          type: string
        status:
          type: string
          enum: [pending, active, done]
        startsAt:
          type: string
          format: date-time
        consentedAt:
          type: string
          format: date-time
          nullable: true
        unsubscribedAt:
          type: string
          format: date-time
          nullable: true
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/AftercareDelivery"
      required:
        [
          id,
          caseId,
          contactId,
          contactName,
          email,
          phone,
          brandedAs,
          status,
          startsAt,
          consentedAt,
          unsubscribedAt,
          deliveries,
        ]

    AftercareDelivery:
      type: object
      properties:
        id:
          type: integer
        dayOffset:
          type: integer
        dueAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
        failedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, dayOffset, dueAt, sentAt, failedAt]

    AftercareConsentInput:
      type: object
      properties:
        consent:
          type: boolean
        email:
          type: string
          nullable: true
      required: [consent]

    # -------------------------------------------------------------- family --

    FamilySession:
      type: object
      description: |
        Everything the family portal needs on first load, in one call - the
        portal is opened on a phone, on mobile data, at a kitchen table, and
        four round trips before anything renders is four chances to look
        broken.
      properties:
        contact:
          $ref: "#/components/schemas/FamilyContact"
        home:
          $ref: "#/components/schemas/PublicFuneralHome"
        case:
          $ref: "#/components/schemas/Case"
        leadDirector:
          oneOf:
            - $ref: "#/components/schemas/StaffSignature"
            - type: "null"
        photoCount:
          type: integer
        photoLimit:
          type: integer
        obituaryStatus:
          type: string
          enum: [family_draft, submitted, approved]
        outstandingDeadlines:
          type: integer
        unreadMessages:
          type: integer
        messagesLocked:
          type: boolean
        aftercare:
          oneOf:
            - $ref: "#/components/schemas/AftercareEnrollment"
            - type: "null"
      required:
        [
          contact,
          home,
          case,
          leadDirector,
          photoCount,
          photoLimit,
          obituaryStatus,
          outstandingDeadlines,
          unreadMessages,
          messagesLocked,
          aftercare,
        ]
