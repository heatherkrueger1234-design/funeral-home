          decedentLastName,
          decedentPreferredName,
          displayName,
          dateOfBirth,
          dateOfDeath,
          portraitPhotoId,
          referencePhotoId,
          serviceAt,
          serviceLocation,
          serviceNotes,
          postalCode,
          leadDirectorId,
          status,
          closedAt,
          messagesLockAt,
          createdAt,
        ]

    CaseSummary:
      description: |
        A case as it appears in the director's list. The counts are what turn
        the list into a worklist: they answer "which family is behind" without
        opening anything.
      allOf:
        - $ref: "#/components/schemas/Case"
        - type: object
          properties:
            photoCount:
              type: integer
            unreadFamilyMessages:
              type: integer
            outstandingDeadlines:
              type: integer
            obituaryStatus:
              type: string
              enum: [family_draft, submitted, approved]
            nextOfKinName:
              type: string
              nullable: true
          required:
            [
              photoCount,
              unreadFamilyMessages,
              outstandingDeadlines,
              obituaryStatus,
              nextOfKinName,
            ]

    CaseDetail:
      allOf:
        - $ref: "#/components/schemas/CaseSummary"
        - type: object
          properties:
            leadDirector:
              oneOf:
                - $ref: "#/components/schemas/StaffSignature"
                - type: "null"
            contacts:
              type: array
              items:
                $ref: "#/components/schemas/FamilyContact"
          required: [leadDirector, contacts]

    CaseInput:
      type: object
      properties:
        kind:
          type: string
          enum: [at_need, pre_need]
          description: |
            Defaults to `at_need`. `pre_need` opens a file for someone who is
            still alive and arranging their own funeral; the same
            collaboration, so that on the day they die the home changes this
            one field and nothing has to be re-typed.
        decedentFirstName:
          type: string
          minLength: 1
        decedentLastName:
          type: string
          minLength: 1
        decedentPreferredName:
          type: string
          nullable: true
        dateOfBirth:
          type: string
          format: date-time
          nullable: true
        dateOfDeath:
          type: string
          format: date-time
          nullable: true
        serviceAt:
          type: string
          format: date-time
          nullable: true
        serviceLocation:
          type: string
          nullable: true
        leadDirectorId:
          type: integer
          nullable: true
      required: [decedentFirstName, decedentLastName]

