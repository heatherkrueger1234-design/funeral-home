      responses:
        "200":
          description: The document
          content:
            text/html:
              schema:
                type: string

  /family/print:
    get:
      operationId: getFamilyPrintItems
      tags: [family]
      summary: Proofs the funeral home has shared for checking
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrintItem"

  /uploads:
    post:
      operationId: uploadFile
      tags: [uploads]
      summary: Store bytes (the home's logo, or a staff-added photograph)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSummary"

  /uploads/{uploadId}:
    get:
      operationId: getUpload
      tags: [uploads]
      summary: Serve stored bytes
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ---------------------------------------------------------------- family --
  #
  # Everything below is reached with the link token, not a session. None of
  # these paths carry a case id: the token names exactly one case, and a
  # family member has no other case they could be asking for. That is what
  # makes the whole surface safe to expose to an unauthenticated stranger
  # holding a forwarded text message.

  /family/session:
    get:
      operationId: getFamilySession
      tags: [family]
      summary: Who this link belongs to, and everything needed to draw the portal
      description: |
        The first call the portal makes. Returns the home (for branding and
        the urgent number), the person who died, the service details, what is
        outstanding, and the contact the link identifies. A revoked, expired
        or unknown token is a 401 here and the portal shows the "ask the home
        for a new link" screen.
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilySession"

  /family/photos:
    get:
      operationId: getFamilyPhotos
      tags: [family]
      summary: The photographs uploaded so far
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CasePhoto"
    post:
      operationId: uploadFamilyPhoto
      tags: [family]
      summary: Add a photograph to the bin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FamilyPhotoUploadInput"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePhoto"

  /family/photos/{photoId}:
    patch:
      operationId: updateFamilyPhoto
      tags: [family]
      summary: Caption a photograph, or set its portrait crop
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyPhotoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePhoto"
    delete:
      operationId: deleteFamilyPhoto
      tags: [family]
      summary: Remove a photograph this family uploaded
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "204":
          description: Deleted

  /family/reference-photo:
    put:
      operationId: setFamilyReferencePhoto
      tags: [family]
      summary: Choose the photograph showing how they wore their hair and makeup
      description: |
        Handed to whoever prepares them. Deliberately separate from the
        portrait: the portrait is the picture the family loves, which is often
        thirty years old and in profile, and what the preparation room needs
        is a clear recent front-on face.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoIdInput"
      responses:
        "200":
          description: The chosen photograph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePhoto"

  /family/photos/selection:
    put:
      operationId: setFamilyPhotoSelection
      tags: [family]
      summary: Choose which photographs run in the slideshow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoSelectionInput"
      responses:
        "200":
          description: The bin, with the new selection marked
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CasePhoto"

  /family/portrait:
    put:
      operationId: setFamilyPortrait
      tags: [family]
      summary: Choose the main portrait
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortraitInput"
      responses:
        "200":
          description: The chosen photograph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePhoto"

  /family/obituary:
    get:
      operationId: getFamilyObituary
      tags: [family]
      summary: The obituary form as the family left it
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryDraft"
    put:
      operationId: updateFamilyObituary
      tags: [family]
      summary: Save the obituary fields
      description: |
        Refused once the director has approved the obituary for print, so that
        a well-meaning relative cannot change the text after it has gone to
        the printer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObituaryFieldsInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryDraft"

  /family/obituary/submit:
    post:
      operationId: submitFamilyObituary
      tags: [family]
      summary: Hand the obituary to the director
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryDraft"

  /family/selections:
    get:
      operationId: getFamilySelections
      tags: [family]
      summary: Hymns, readings and pallbearers chosen so far
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceSelection"
    post:
      operationId: createFamilySelection
      tags: [family]
      summary: Add a hymn, reading, or pallbearer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceSelection"

  /family/selections/{selectionId}:
    delete:
      operationId: deleteFamilySelection
      tags: [family]
      summary: Remove a selection the director has not confirmed
      parameters:
        - $ref: "#/components/parameters/SelectionId"
      responses:
        "204":
          description: Deleted

  /family/messages:
    get:
      operationId: getFamilyMessages
      tags: [family]
      summary: The thread with the funeral home
      responses:
        "200":
          description: The thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageThread"
    post:
      operationId: postFamilyMessage
      tags: [family]
      summary: Ask the director something
      description: |
        Always delivered, whatever the hour. When it is sent outside the
        home's office hours the response says so, so the portal can tell the
        family plainly when it will be read and offer the 24-hour line - which
        is a truthful thing to say, unlike holding the message back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMessage"

  /family/deadlines:
    get:
      operationId: getFamilyDeadlines
      tags: [family]
      summary: What is due, and when the service is
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseDeadline"

  /family/deadlines/{deadlineId}:
    post:
      operationId: completeFamilyDeadline
      tags: [family]
      summary: Mark something done, or undo that
      parameters:
        - $ref: "#/components/parameters/DeadlineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteDeadlineInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDeadline"

  /family/aftercare:
    post:
      operationId: setFamilyAftercareConsent
      tags: [family]
      summary: Accept or decline the grief check-ins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AftercareConsentInput"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AftercareEnrollment"

  /family/uploads/{uploadId}:
    get:
      operationId: getFamilyUpload
      tags: [family]
      summary: Serve a photograph on this case, or the home's logo
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # -------------------------------------------------------------- platform --

  /admin/auth/login:
    post:
      operationId: platformLogin
      tags: [platform]
      summary: Sign in to the platform console
      description: |
        A different credential, a different cookie and a shorter session than
        a director's. This account can read across every funeral home in the
        system, so a laptop left open should stop being a problem the same day
        rather than the same month.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAdmin"
        "401":
          description: Wrong email or password
        "429":
          description: Too many attempts

  /admin/auth/logout:
    post:
      operationId: platformLogout
      tags: [platform]
      summary: Sign out of the platform console
      responses:
        "204":
          description: Signed out

  /admin/auth/me:
    get:
      operationId: getPlatformMe
      tags: [platform]
      summary: Who is signed in to the platform console
      responses:
        "200":
          description: The signed-in platform account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAdmin"
        "401":
          description: Not signed in

  # ------------------------------------------- family access and passwords --

  /family/password:
    put:
      operationId: setFamilyOwnPassword
      tags: [family]
      summary: Choose a password for this link
      description: |
        Set *after* the link has been followed, never as a wall in front of it.
        A password is required before an authorizing contact can sign anything,
        because a text message can be forwarded and a signature about burying
        somebody should need more than holding that message.

        Replacing an existing password requires the current one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyPasswordInput"
      responses:
        "204":
          description: Set
        "400":
          description: Too short
        "401":
          description: The current password did not match

  /contacts/{contactId}/access:
    patch:
      operationId: setContactAccess
      tags: [contacts]
      summary: Set what this person may do
      description: |
        Staff only, and never self-selected. `authorizing` additionally
        requires recording which tier of the statutory priority order the
        determination was made under — see the authority endpoint.
      parameters:
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactAccessInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyContact"
        "404":
          description: No such contact

  /contacts/{contactId}/authority:
    post:
      operationId: recordContactAuthority
      tags: [contacts]
      summary: Record who holds the right of final disposition
      description: |
        The director's determination, from documents, written down. **The
        software never works this out.** Inferring the right of final
        disposition from a relationship dropdown would be confidently wrong in
        exactly the cases that end up in front of a probate judge.

        Recording this raises the contact to `authorizing`. They still cannot
        sign anything until they have a password.
      parameters:
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactAuthorityInput"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyContact"
        "404":
          description: No such contact

  /contacts/{contactId}/password:
    post:
      operationId: setContactPassword
      tags: [contacts]
      summary: Set an initial password to hand over
      description: |
        Generates a password the director reads out on the telephone or hands
        over in person, which is how a funeral home already does everything
        else. Returned once and never retrievable again.
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: Set, and shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedPassword"
        "404":
          description: No such contact

  /cases/{caseId}/disposition-dispute:
    put:
      operationId: setDispositionDispute
      tags: [cases]
      summary: Mark the right of final disposition as contested
      description: |
        While set, the family portal stops offering authorizing actions and
        says plainly that the home is confirming who is arranging the funeral.

        Colorado sends disputes between people of equal priority to the probate
        court, and a third party may decline to act until it has confirmation
        the argument is over. Declining is the safe posture; this makes it the
        automatic one.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispositionDisputeInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "404":
          description: No such case

  # ------------------------------------------------------- storefront: the
  # catalogue --
  #
  # What a home sells, at the home's own prices. Ships empty: nothing in this
  # section, and nothing behind it, creates an item or suggests a price. The
  # sections an item can belong to are the FTC Funeral Rule's own divisions,
  # because they decide which of the three statutory price lists it prints on.

  /storefront/settings:
    get:
      operationId: getStorefrontSettings
      tags: [catalogue]
      summary: The price list's effective date, its disclosures, and how the home is paid
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontSettings"
    put:
      operationId: updateStorefrontSettings
      tags: [catalogue]
      summary: Change them
      description: |
        Disclosures are merged by key rather than replaced, because the console
        edits one slot at a time and a PUT that dropped the others would strip
        a home's price list of paragraphs their attorney wrote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorefrontSettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontSettings"

  /catalogue:
    get:
      operationId: getCatalogue
      tags: [catalogue]
      summary: Everything this home sells, by category
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalogue"

  /catalogue/categories:
    post:
      operationId: createCatalogueCategory
      tags: [catalogue]
      summary: Add a category, named by the home
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogueCategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueCategory"

  /catalogue/categories/{categoryId}:
    put:
      operationId: updateCatalogueCategory
      tags: [catalogue]
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogueCategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueCategory"
        "404":
          description: No such category
    delete:
      operationId: deleteCatalogueCategory
      tags: [catalogue]
      summary: Remove it, or retire it if a family has already chosen from it
      description: |
        A category a family has chosen from is part of a statement, and a
        statement is a document the home handed across a desk. So once one of
        its items appears on any selection this archives instead of deleting,
        and says which it did.
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: Archived rather than deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchivedInstead"
        "204":
          description: Deleted
        "404":
          description: No such category

  /catalogue/items:
    post:
      operationId: createCatalogueItem
      tags: [catalogue]
      summary: Add one item, at the home's own price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogueItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueItem"

  /catalogue/items/{itemId}:
    put:
      operationId: updateCatalogueItem
      tags: [catalogue]
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogueItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueItem"
        "404":
          description: No such item
    delete:
      operationId: deleteCatalogueItem
      tags: [catalogue]
      summary: Remove it, or retire it if a family has already chosen it
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Archived rather than deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchivedInstead"
        "204":
          description: Deleted
        "404":
          description: No such item

  /catalogue/packages:
    post:
      operationId: createCataloguePackage
      tags: [catalogue]
      summary: Offer several items together, at a price of the home's own
      description: |
        In addition to the itemised catalogue, never instead of it. Choosing a
        package writes its members as ordinary itemised lines plus a single
        adjustment carrying the difference, so declining any one of them still
        works and still moves the total.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CataloguePackageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CataloguePackage"

  /catalogue/packages/{packageId}:
    put:
      operationId: updateCataloguePackage
      tags: [catalogue]
      parameters:
        - $ref: "#/components/parameters/PackageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CataloguePackageUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CataloguePackage"
        "404":
          description: No such package
    delete:
      operationId: deleteCataloguePackage
      tags: [catalogue]
      summary: Withdraw it, or retire it if a family has already chosen it
      description: |
        Archived rather than deleted once anybody has chosen it. A selection's
        lines point back at the package they came from, and that link is what
        lets declining one of its items take the package's price adjustment
        with it.
      parameters:
        - $ref: "#/components/parameters/PackageId"
      responses:
        "200":
          description: Archived rather than deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchivedInstead"
        "204":
          description: Deleted
        "404":
          description: No such package

  /catalogue/import/preview:
    post:
      operationId: previewCatalogueImport
      tags: [catalogue]
      summary: Read a price sheet and show what would be loaded
      description: |
        Always run before importing. Returns the guessed column mapping, the
        guessed price list for each of the home's own category names, the first
        rows as they would be created, and every row that could not be read.

        Columns labelled cost or wholesale are never read as a price. They sit
        beside the retail column in every supplier's export, and importing one
        would publish a home's margin on the sheet it hands a family.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CsvUploadInput"
      responses:
        "200":
          description: What would happen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueImportPreview"

  /catalogue/import:
    post:
      operationId: importCatalogue
      tags: [catalogue]
      summary: Load a price sheet
      description: |
        Matches on the home's own item code where there is one and on name
        otherwise, so dropping in last year's sheet again updates prices rather
        than doubling the catalogue.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CatalogueImportInput"
      responses:
        "200":
          description: What was loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueImportResult"

  /catalogue/price-lists/{kind}/render:
    get:
      operationId: renderPriceList
      tags: [catalogue]
      summary: The General, Casket or Outer Burial Container Price List
      description: |
        Print-ready HTML on letter paper. The three documents the Funeral Rule
        requires a provider to be able to produce, rendered from the same
        function the family surface renders them from — a family and a director
        looking at two different price lists is the bug this makes impossible.
      parameters:
        - $ref: "#/components/parameters/PriceListKind"
      responses:
        "200":
          description: The document
          content:
            text/html:
              schema:
                type: string
        "400":
          description: There is nothing in the catalogue to put on that list

  # -------------------------------------- storefront: what a family chose --
  #
  # The selection record, and the Statement of Funeral Goods and Services
  # Selected that comes out of it. Everything is itemised, always: no operation
  # below can record a purchase without a per-item price, and removing anything
  # changes the total in front of whoever is looking at it.
  #
  # The one exception is the path a family takes when they are bringing their
  # own casket or urn, which carries no price at all — a provider may not
  # refuse a third-party casket and may not charge for handling one.

  /cases/{caseId}/selection:
    get:
      operationId: getCaseStorefront
      tags: [orders]
      summary: The catalogue and this family's selection, as the director sees it
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The storefront for this case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storefront"
        "404":
          description: No such case
    put:
      operationId: updateMerchandiseSelection
      tags: [orders]
      summary: Agree the arrangement, reopen it, or note the home's own books
      description: |
        `settled` is a note about the home's records and nothing more. We
        process no payments, so we cannot know whether one was made; a request
        to settle a `pre_need` case is refused, because nothing is owed on a
        plan.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchandiseSelectionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storefront"
        "400":
          description: Nothing chosen yet, or a plan cannot be settled
        "404":
          description: No such case

  /cases/{caseId}/selection/gpl-given:
    post:
      operationId: recordGplGiven
      tags: [orders]
      summary: Record that this family has the General Price List
      description: |
        Set by the family opening it, and by a director recording that they
        handed one across the desk. Both are the same fact and both unlock the
        same thing: the Rule cares that the family has the list, not which way
        it reached them.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchandiseSelection"
        "404":
          description: No such case

  /cases/{caseId}/selection/items:
    post:
      operationId: addSelectionItem
      tags: [orders]
      summary: Put a catalogue item on the sheet
      description: |
        There is no price in this body and there never will be. What a thing
        costs is copied from the home's own catalogue row at the moment the
        line is written — a client that could name a price could name a
        different one.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionItemInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchandiseSelection"
        "400":
          description: A casket, before this family has the General Price List
        "404":
          description: No such case or item

  /cases/{caseId}/selection/packages:
    post:
      operationId: addSelectionPackage
      tags: [orders]
      summary: Fill the sheet from a package
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionPackageInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchandiseSelection"
        "400":
          description: A casket, before this family has the General Price List
        "404":
          description: No such case or package

  /cases/{caseId}/selection/family-provided:
    post:
      operationId: addFamilyProvidedItem
      tags: [orders]
      summary: Record that the family is bringing their own
      description: |
        No price is accepted here, and none is stored. A funeral provider may
        not refuse a casket or urn a family bought elsewhere and may not charge
        a handling fee for one, so there is nowhere on this path for a fee to
        go — enforced by a check constraint on the table as well as by this
        schema.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyProvidedInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchandiseSelection"
        "404":
          description: No such case

  /cases/{caseId}/selection/items/{lineId}:
    put:
      operationId: updateSelectionLine
      tags: [orders]
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/LineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionLineUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchandiseSelection"
        "400":
          description: The arrangement has been agreed, or that line follows a package
        "404":
          description: No such case or line
    delete:
      operationId: removeSelectionLine
      tags: [orders]
      summary: Decline something, and watch the total change
      description: |
        When the line came in as part of a package, the package's adjustment
        goes with it: the set is broken, so everything left stands at its own
        price.
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/LineId"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchandiseSelection"
        "400":
          description: The arrangement has been agreed
        "404":
          description: No such case or line

  /cases/{caseId}/statement/render:
    get:
      operationId: renderStatement
      tags: [orders]
      summary: The Statement of Funeral Goods and Services Selected
      description: |
        The itemised document the Funeral Rule requires a provider to give at
        the end of an arrangement, generated from what the family actually
        chose. Carries the legal name; every other screen says what they were
        called, and this one is read beside a death certificate.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The document
          content:
            text/html:
              schema:
                type: string
        "404":
          description: No such case

  # --------------------------------- storefront: the family's own browsing --
  #
  # Reached with the link token, like everything else under `/family`, and
  # carrying no case id for the same reason. What differs from the director's
  # view above is the sequence: no casket and no outer burial container is
  # returned here until this family has the General Price List.

  /family/storefront:
    get:
      operationId: getFamilyStorefront
      tags: [orders]
      summary: What this family may see, and what they have chosen
      responses:
        "200":
          description: The storefront
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storefront"

  /family/storefront/price-lists/{kind}/render:
    get:
      operationId: renderFamilyPriceList
      tags: [orders]
      summary: The price list, as the family reads it
      description: |
        Opening the General Price List records that this family has it, which
        is the moment caskets become visible. A side effect on a GET, and the
        honest option: the fact the Rule cares about is that the family has the
        list, and that becomes true when the sheet renders.

        The Casket and Outer Burial Container lists are behind the same gate as
        the caskets themselves.
      parameters:
        - $ref: "#/components/parameters/PriceListKind"
      responses:
        "200":
          description: The document
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Nothing to print, or a casket list before the General Price List

  /family/storefront/items:
    post:
      operationId: addFamilyStorefrontItem
      tags: [orders]
      summary: Choose something
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionItemInput"
      responses:
        "201":
          description: Chosen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchandiseSelection"
        "400":
          description: A casket before the General Price List, or the arrangement is agreed

  /family/storefront/packages:
    post:
      operationId: addFamilyStorefrontPackage
      tags: [orders]
      summary: Choose a package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionPackageInput"
      responses:
        "201":
          description: Chosen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchandiseSelection"
        "400":
          description: A casket before the General Price List, or the arrangement is agreed

  /family/storefront/family-provided:
    post:
      operationId: addFamilyProvidedToStorefront
      tags: [orders]
      summary: Tell the home you are bringing your own
      description: |
        A name, and optionally a note about who is bringing it and when. No
        price, no fee, and nowhere for one to be added later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyProvidedInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchandiseSelection"
        "400":
          description: The arrangement has been agreed

  /family/storefront/items/{lineId}:
    put:
      operationId: updateFamilyStorefrontLine
      tags: [orders]
      parameters:
        - $ref: "#/components/parameters/LineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionLineUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchandiseSelection"
        "400":
          description: The arrangement has been agreed
        "404":
          description: No such line
    delete:
      operationId: removeFamilyStorefrontLine
      tags: [orders]
      summary: Change your mind about something
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchandiseSelection"
        "400":
          description: The arrangement has been agreed
        "404":
          description: No such line
      parameters:
        - $ref: "#/components/parameters/LineId"

  /family/storefront/statement/render:
    get:
      operationId: renderFamilyStatement
      tags: [orders]
      summary: The family's own copy of the statement
      responses:
        "200":
          description: The document
          content:
            text/html:
              schema:
                type: string

  /family/storefront/uploads/{uploadId}:
    get:
      operationId: getFamilyCataloguePhoto
      tags: [orders]
      summary: A photograph of something in the catalogue
      description: |
        The home's catalogue photographs belong to no case, so the family's
        ordinary upload route — which serves only files on their own case —
        cannot reach them, and rightly so. This one checks the file is in use
        by a live item in this home's catalogue before it serves a byte.
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: The bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        "400":
          description: Not a photograph on this home's catalogue

  # ------------------------------------------------------- engagement: what
  # the home can see about how a family is getting on --
  #
  # Counting happens once, here, and two audiences read the result. A
  # director asks "did that text land, and is this family stuck?"; the
  # platform admin console asks "are these homes getting value?" and reads
  # the same computation aggregated per home.
  #
  # Nothing in this section ranks a family or scores one. `attention` is a
  # list of plain sentences about what has not happened yet, written to be
  # read aloud on a telephone.

  /engagement:
    get:
      operationId: getHomeEngagement
      tags: [engagement]
      summary: This home's own totals, and which cases are worth a look
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeEngagementReport"

  /cases/{caseId}/engagement:
    get:
      operationId: getCaseEngagement
      tags: [engagement]
      summary: Who has opened their link, who is contributing, what is outstanding
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseEngagement"

  # ------------------------------------------------- engagement: Colorado's
  # own clock --
  #
  # These apply themselves. A director confirms the two dates only they know
  # -- when the home took custody, and when the EDRS request went out -- and
  # the deadlines follow from the statute rather than from anybody's
  # preference. The family never sees any of this: it is the home's legal
  # obligation, not a widow's homework.

  /cases/{caseId}/statutory:
    get:
      operationId: getStatutorySchedule
      tags: [engagement]
      summary: Colorado's deadlines on this case, with what each one is measured from
      description: |
        Builds the schedule if it is not there yet, so a director is never
        asked to press a button to be told about their own 72 hours.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatutorySchedule"

  /cases/{caseId}/statutory/clock:
    put:
      operationId: confirmStatutoryClock
      tags: [engagement]
      summary: Confirm when custody was taken, and when the EDRS request went out
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatutoryClockInput"
      responses:
        "200":
          description: The schedule, recalculated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatutorySchedule"

  /statutory-deadlines/{statutoryDeadlineId}:
    put:
      operationId: updateStatutoryDeadline
      tags: [engagement]
      summary: Mark one done, or record that it does not apply
      parameters:
        - $ref: "#/components/parameters/StatutoryDeadlineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatutoryDeadlineUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatutoryDeadline"

  # --------------------------------------------- engagement: offered times --
  #
  # The home defines the options and the family picks one. There is
  # deliberately no endpoint anywhere that accepts a date a family typed:
  # a date nobody read is how a family ends up outside a locked chapel.

  /cases/{caseId}/slots:
    get:
      operationId: getCaseSlots
      tags: [engagement]
      summary: What this case has been offered, and what it has taken
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppointmentSlot"
    post:
      operationId: offerSlots
      tags: [engagement]
      summary: Open one or more times for this family
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlotOfferInput"
      responses:
        "201":
          description: Offered
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppointmentSlot"

  /slots/{slotId}:
    delete:
      operationId: withdrawSlot
      tags: [engagement]
      summary: Take a time back off the table
      description: |
        Withdrawn rather than deleted. A family who had it booked is told it
        is gone, instead of watching it vanish between two page loads.
      parameters:
        - $ref: "#/components/parameters/SlotId"
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentSlot"

  /cases/{caseId}/slots/notice:
    post:
      operationId: textFamilyAboutSlots
      tags: [engagement]
      summary: Text the family that there are times to choose from
      description: |
        Refused with a 409 for any number this home has no recorded consent
        for, and for any number that has ever sent STOP. Nothing in this
        product sends a text by another route.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlotNoticeInput"
      responses:
        "200":
          description: What was sent, and to whom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotNoticeResult"
        "409":
          description: No recorded consent for that number

  # ----------------------------------- engagement: who said we may write --

  /cases/{caseId}/messaging-consent:
    get:
      operationId: getMessagingConsent
      tags: [engagement]
      summary: Who on this case may be texted, and who has asked us to stop
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessagingConsentState"
    post:
      operationId: recordMessagingConsent
      tags: [engagement]
      summary: Record that somebody agreed to be texted
      description: |
        For the yes that happens on the telephone. Records who took it and
        when, because "we have consent" is not a defence and "she agreed at
        14:02 on the ninth, to Karen" is.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessagingConsentInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingConsentState"
        "409":
          description: That address has asked us to stop, permanently

  # --------------------------------------- engagement: what the family keeps

  /cases/{caseId}/keepsake:
    get:
      operationId: getCaseKeepsake
      tags: [engagement]
      summary: What this family is left with once the service is over
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The keepsake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keepsake"

  # ------------------------------------------- engagement: the family side --
  #
  # Reached with the link token like everything else under /family, and
  # carrying no case id for the same reason.

  /family/slots:
    get:
      operationId: getFamilySlots
      tags: [engagement]
      summary: Times you can choose from, and the one you have
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppointmentSlot"

  /family/slots/{slotId}/take:
    post:
      operationId: takeFamilySlot
      tags: [engagement]
      summary: Take one of the offered times
      parameters:
        - $ref: "#/components/parameters/SlotId"
      responses:
        "200":
          description: Taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentSlot"
        "409":
          description: Somebody took that one first

  /family/slots/{slotId}/release:
    post:
      operationId: releaseFamilySlot
      tags: [engagement]
      summary: Give a time back
      parameters:
        - $ref: "#/components/parameters/SlotId"
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentSlot"

  /family/messaging-consent:
    post:
      operationId: setFamilyMessagingConsent
      tags: [engagement]
      summary: Say whether the home may text this number
      description: |
        "No" is permanent and is honoured everywhere, including the aftercare
        check-ins. Nothing in this product asks again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyMessagingConsentInput"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingConsentState"

  /family/keepsake:
    get:
      operationId: getFamilyKeepsake
      tags: [engagement]
      summary: The photographs, the obituary, the order of service, the check-ins
      description: |
        After the service the working surfaces recede and this is what is
        left. It lives here, inside the product, and is never a handoff to
        another application.
      responses:
        "200":
          description: The keepsake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keepsake"


components:
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: integer
    IntakeId:
      name: intakeId
      in: path
      required: true
      schema:
        type: integer
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: integer
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: integer
    SelectionId:
      name: selectionId
      in: path
      required: true
      schema:
        type: integer
    DeadlineId:
      name: deadlineId
      in: path
      required: true
      schema:
        type: integer
    SnippetId:
      name: snippetId
      in: path
      required: true
      schema:
        type: integer
    PrintItemId:
      name: printItemId
      in: path
      required: true
      schema:
        type: integer
    VendorId:
      name: vendorId
      in: path
      required: true
      schema:
        type: integer
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: integer
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
    PackageId:
      name: packageId
      in: path
      required: true
      schema:
        type: integer
    LineId:
      name: lineId
      in: path
      required: true
      schema:
        type: integer
    PriceListKind:
      name: kind
      in: path
      required: true
      description: Which of the three statutory lists.
      schema:
        type: string
        enum: [gpl, cpl, obcpl]
    SlotId:
      name: slotId
      in: path
      required: true
      schema:
        type: integer
    StatutoryDeadlineId:
      name: statutoryDeadlineId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    HealthStatus:
      type: object
      description: |
        Reports on the database, because a process that is up but cannot reach
        Postgres serves errors on every screen -- and a health check that
        answers "ok" to that keeps it in the load balancer.
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: boolean
        mail:
          type: boolean
          description: Whether real email can go out, or is only logged.
        sms:
          type: boolean
          description: Whether family links can actually be texted from here.
      required: [status, database, mail, sms]

    # ---------------------------------------------------------------- auth --

    RegisterInput:
      type: object
      properties:
        homeName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        displayName:
          type: string
          nullable: true
      required: [homeName, email, password]

    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    ForgotPasswordInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ResetPasswordInput:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 10
      required: [token, password]

    StaffMember:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        displayName:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, director, staff]
        deactivatedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, email, displayName, title, role, deactivatedAt]

    TimelineTemplate:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        offsetMinutes:
          type: integer
          description: Relative to the service. Negative is before it.
        offsetLabel:
          type: string
          description: The offset in words, e.g. "3 days before".
        isEvent:
          type: boolean
        enabled:
          type: boolean
        position:
          type: integer
      required:
        [id, title, description, offsetMinutes, offsetLabel, isEvent, enabled, position]

    TimelineTemplateInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        offsetMinutes:
          type: integer
        isEvent:
          type: boolean
      required: [title, offsetMinutes]

    TimelineTemplateUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        offsetMinutes:
          type: integer
        isEvent:
          type: boolean
        enabled:
          type: boolean
        position:
          type: integer

    OnboardingItem:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        detail:
          type: string
        done:
          type: boolean
      required: [key, title, detail, done]

    Billing:
      type: object
      properties:
        subscriptionStatus:
          type: string
          enum: [trial, active, past_due, canceled]
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        trialDaysLeft:
          type: integer
          nullable: true
        currentPeriodEndsAt:
          type: string
          format: date-time
          nullable: true
        canOpenCases:
          type: boolean
        billingConfigured:
          type: boolean
          description: False when this deployment has no Stripe keys.
        hasSubscription:
          type: boolean
        onboarding:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingItem"
        onboardingComplete:
          type: boolean
      required:
        [
          subscriptionStatus,
          trialEndsAt,
          trialDaysLeft,
          currentPeriodEndsAt,
          canOpenCases,
          billingConfigured,
          hasSubscription,
          onboarding,
          onboardingComplete,
        ]

    BillingReturnInput:
      type: object
      properties:
        returnUrl:
          type: string
          description: Where Stripe sends them back to.
      required: [returnUrl]

    BillingRedirect:
      type: object
      properties:
        url:
          type: string
      required: [url]

    OnboardingStepInput:
      type: object
      properties:
        step:
          type: string
        done:
          type: boolean
      required: [step]

    StaffInviteInput:
      type: object
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, director, staff]
      required: [email]

    StaffMemberWithInvite:
      description: |
        Returned once, when a colleague is added. `inviteLink` is shown to the
        owner so they can pass it on if the email does not arrive; it is the
        ordinary single-use password-reset link and is never retrievable again.
      allOf:
        - $ref: "#/components/schemas/StaffMember"
        - type: object
          properties:
            inviteLink:
              type: string
          required: [inviteLink]

    StaffUpdate:
      type: object
      properties:
        displayName:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, director, staff]
        active:
          type: boolean
          description: False takes their access away without deleting their history.

    AuthUser:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/StaffMember"
        home:
          $ref: "#/components/schemas/FuneralHome"
      required: [user, home]

    # ---------------------------------------------------------------- home --

    FuneralHome:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        logoUploadId:
          type: integer
          nullable: true
        accentColor:
          type: string
        phone:
          type: string
          nullable: true
        urgentPhone:
          type: string
          nullable: true
        addressLine1:
          type: string
          nullable: true
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        officeOpensMinute:
          type: integer
        officeClosesMinute:
          type: integer
        timezone:
          type: string
        aftercareEnabled:
          type: boolean
        intakeEnabled:
          type: boolean
          description: |
            Whether the home's public page will take a request from somebody
            nobody has sent a link to.
        intakeNotifyEmail:
          type: string
          nullable: true
          description: |
            Where a request lands. Falls back to the owner's address, because
            a form that fills a queue nobody opens is worse than no form -
            the family believes they have reached someone.
        aftercareSenderName:
          type: string
          nullable: true
        subscriptionStatus:
          type: string
          enum: [trial, active, past_due, canceled]
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
      required:
        [
          id,
          name,
          slug,
          logoUploadId,
          accentColor,
          phone,
          urgentPhone,
          officeOpensMinute,
          officeClosesMinute,
          timezone,
          aftercareEnabled,
          intakeEnabled,
          subscriptionStatus,
        ]

    FuneralHomeUpdate:
      type: object
      properties:
        name:
          type: string
        logoUploadId:
          type: integer
          nullable: true
        accentColor:
          type: string
        phone:
          type: string
          nullable: true
        urgentPhone:
          type: string
          nullable: true
        addressLine1:
          type: string
          nullable: true
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        officeOpensMinute:
          type: integer
          minimum: 0
          maximum: 1439
        officeClosesMinute:
          type: integer
          minimum: 0
          maximum: 1439
        timezone:
          type: string
        aftercareEnabled:
          type: boolean
        intakeEnabled:
          type: boolean
        intakeNotifyEmail:
          type: string
          nullable: true
        aftercareSenderName:
          type: string
          nullable: true

    # ------------------------------------------------------- what a family sees

    PublicFuneralHome:
      type: object
      description: The home as a family may see it - branding and how to reach it.
      properties:
        name:
          type: string
        slug:
          type: string
        accentColor:
          type: string
        logoUploadId:
          type: integer
          nullable: true
        phone:
          type: string
          nullable: true
        urgentPhone:
          type: string
          nullable: true
        addressLine1:
          type: string
          nullable: true
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        intakeEnabled:
          type: boolean
          description: |
            False means this home would rather the first contact were a phone
            call. Show the number instead of the request form.
        officeOpensMinute:
          type: integer
        officeClosesMinute:
          type: integer
        timezone:
          type: string
      required:
        [
          name,
          slug,
          accentColor,
          logoUploadId,
          phone,
          urgentPhone,
          addressLine1,
          addressLine2,
          city,
          region,
          postalCode,
          intakeEnabled,
          officeOpensMinute,
          officeClosesMinute,
          timezone,
        ]

    StaffSignature:
      type: object
      description: A staff member as a family sees them - a name and a title.
      properties:
        displayName:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
      required: [displayName, title]

    # -------------------------------------------------------------- intake --

    IntakeRequestInput:
      type: object
      description: |
        A request from someone nobody has sent a link to. `kind` decides
        everything downstream: `at_need` is a family whose person has died,
        `pre_need` is a living person arranging their own funeral, where the
        requester and the subject are the same and `dateOfDeath` must be
        absent.
      properties:
        homeSlug:
          type: string
          description: Which home is being asked. From the public page's URL.
          minLength: 1
          maxLength: 120
        kind:
          type: string
          enum: [at_need, pre_need]
        requesterName:
          type: string
          minLength: 1
          maxLength: 120
        requesterEmail:
          type: string
          nullable: true
          maxLength: 200
        requesterPhone:
          type: string
          nullable: true
          maxLength: 40
        relationship:
          type: string
          nullable: true
          maxLength: 80
          description: How they are related. Omitted for a pre-need request.
        subjectFirstName:
          type: string
          minLength: 1
          maxLength: 120
        subjectLastName:
          type: string
          minLength: 1
          maxLength: 120
        dateOfDeath:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
          maxLength: 4000
      required: [homeSlug, kind, requesterName, subjectFirstName, subjectLastName]

    IntakeReceipt:
      type: object
      description: |
        Deliberately thin. It confirms the request arrived and repeats what
        the person should do if it cannot wait, and says nothing about the
        home's queue or whether this person is already known to them.
      properties:
        received:
          type: boolean
        kind:
          type: string
          enum: [at_need, pre_need]
        homeName:
          type: string
        urgentPhone:
          type: string
          nullable: true
      required: [received, kind, homeName, urgentPhone]

    DeleteCaseInput:
      type: object
      properties:
        confirmName:
          type: string
          description: |
            The deceased's name exactly as the case shows it. Compared
            case-insensitively and with surrounding space ignored, because
            this is a confirmation and not a spelling test - but it must be
            typed, not clicked.
        reason:
          type: string
          nullable: true
          maxLength: 500
          description: Recorded on the tombstone. For the home's own records.
      required: [confirmName]

    ConvertToAtNeedInput:
      type: object
      properties:
        dateOfDeath:
          type: string
          format: date-time
          description: |
            Required. Converting without one would leave a file that claims
            somebody died on no particular day, and the schedule counts from
            it.
        serviceAt:
          type: string
          format: date-time
          nullable: true
          description: If it is already known. The schedule is built from it.
      required: [dateOfDeath]

    AcceptedIntake:
      allOf:
        - $ref: "#/components/schemas/Case"
        - type: object
          description: |
            The new case, plus the one thing that exists only at this moment.
          properties:
            familyLink:
              type: string
              description: |
                The link to send the person who asked. Returned once and never
                again - the contact row holds only its digest. A director who
                loses it mints a fresh one from the contact, which also stops
                the old one working.
          required: [familyLink]

    IntakeRequest:
      type: object
      description: One request, as the director sees it in their queue.
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [at_need, pre_need]
        status:
          type: string
          enum: [pending, accepted, declined]
        requesterName:
          type: string
        requesterEmail:
          type: string
          nullable: true
        requesterPhone:
          type: string
          nullable: true
        relationship:
          type: string
          nullable: true
        subjectFirstName:
          type: string
        subjectLastName:
          type: string
        subjectDisplayName:
          type: string
        dateOfDeath:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
        caseId:
          type: integer
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        [
          id,
          kind,
          status,
          requesterName,
          requesterEmail,
          requesterPhone,
          relationship,
          subjectFirstName,
          subjectLastName,
          subjectDisplayName,
          dateOfDeath,
          note,
          caseId,
          reviewedAt,
          createdAt,
        ]

    # --------------------------------------------------------------- cases --

    Case:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [at_need, pre_need]
          description: |
            `pre_need` means the person this file is about is still alive and
            arranging their own funeral. Every label, every date and every
            line of condolence has to read this first.
        dispositionDisputed:
          type: boolean
          description: |
            The home knows the right of final disposition is contested. While
            true, the portal offers no authorizing actions and says the home is
            confirming who is arranging the funeral.
        decedentFirstName:
          type: string
        decedentLastName:
          type: string
        decedentPreferredName:
          type: string
          nullable: true
        displayName:
          type: string
        dateOfBirth:
          type: string
          format: date-time
          nullable: true
        dateOfDeath:
          type: string
          format: date-time
          nullable: true
        portraitPhotoId:
          type: integer
          nullable: true
        referencePhotoId:
          type: integer
          nullable: true
        serviceAt:
          type: string
          format: date-time
          nullable: true
        serviceLocation:
          type: string
          nullable: true
        serviceNotes:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
          description: Where the family is, for finding anything local to them.
        leadDirectorId:
          type: integer
          nullable: true
        status:
          type: string
          enum: [intake, active, closed]
        closedAt:
          type: string
          format: date-time
          nullable: true
        messagesLockAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        [
          id,
          kind,
          decedentFirstName,
          decedentLastName,
          decedentPreferredName,
          displayName,
          dateOfBirth,
          dateOfDeath,
          portraitPhotoId,
          referencePhotoId,
          serviceAt,
          serviceLocation,
          serviceNotes,
          postalCode,
          leadDirectorId,
          status,
          closedAt,
          messagesLockAt,
          createdAt,
        ]

    CaseSummary:
      description: |
        A case as it appears in the director's list. The counts are what turn
        the list into a worklist: they answer "which family is behind" without
        opening anything.
      allOf:
        - $ref: "#/components/schemas/Case"
        - type: object
          properties:
            photoCount:
              type: integer
            unreadFamilyMessages:
              type: integer
            outstandingDeadlines:
              type: integer
            obituaryStatus:
              type: string
              enum: [family_draft, submitted, approved]
            nextOfKinName:
              type: string
              nullable: true
          required:
            [
              photoCount,
              unreadFamilyMessages,
              outstandingDeadlines,
              obituaryStatus,
              nextOfKinName,
            ]

    CaseDetail:
      allOf:
        - $ref: "#/components/schemas/CaseSummary"
        - type: object
          properties:
            leadDirector:
              oneOf:
                - $ref: "#/components/schemas/StaffSignature"
                - type: "null"
            contacts:
              type: array
              items:
                $ref: "#/components/schemas/FamilyContact"
          required: [leadDirector, contacts]

    CaseInput:
      type: object
      properties:
        kind:
          type: string
          enum: [at_need, pre_need]
          description: |
            Defaults to `at_need`. `pre_need` opens a file for someone who is
            still alive and arranging their own funeral; the same
            collaboration, so that on the day they die the home changes this
            one field and nothing has to be re-typed.
        decedentFirstName:
          type: string
          minLength: 1
        decedentLastName:
          type: string
          minLength: 1
        decedentPreferredName:
          type: string
          nullable: true
        dateOfBirth:
          type: string
          format: date-time
          nullable: true
        dateOfDeath:
          type: string
          format: date-time
          nullable: true
        serviceAt:
          type: string
          format: date-time
          nullable: true
        serviceLocation:
          type: string
          nullable: true
        leadDirectorId:
          type: integer
          nullable: true
      required: [decedentFirstName, decedentLastName]

    CaseUpdate:
      type: object
      properties:
        decedentFirstName:
          type: string
          minLength: 1
        decedentLastName:
          type: string
          minLength: 1
        decedentPreferredName:
          type: string
          nullable: true
        dateOfBirth:
          type: string
          format: date-time
          nullable: true
        dateOfDeath:
          type: string
          format: date-time
          nullable: true
        portraitPhotoId:
          type: integer
          nullable: true
        referencePhotoId:
          type: integer
          nullable: true
        serviceAt:
          type: string
          format: date-time
          nullable: true
        serviceLocation:
          type: string
          nullable: true
        serviceNotes:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        leadDirectorId:
          type: integer
          nullable: true
        status:
          type: string
          enum: [intake, active, closed]
        messagesLockAt:
          type: string
          format: date-time
          nullable: true

    # ------------------------------------------------------------ contacts --

    FamilyContact:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: integer
        name:
          type: string
        relationship:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [next_of_kin, contributor]
          description: Who they are to the deceased, not what they may do.
        accessLevel:
          type: string
          enum: [viewing, arranging, authorizing]
          description: |
            What they may do. `authorizing` means they hold the right of final
            disposition under the statutory priority order, as determined by a
            director and recorded here — never computed from `relationship`.
        dispositionTier:
          type: string
          nullable: true
          description: |
            Which tier of the statutory priority order the determination was
            made under, e.g. `surviving_spouse`. Free text, because the statute
            is amended and a case outlives a deployment.
        authorityRecordedAt:
          type: string
          format: date-time
          nullable: true
        hasPassword:
          type: boolean
          description: |
            An authorizing contact cannot sign anything until this is true. A
            forwarded text message is not enough to bury somebody.
        canInvite:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        firstSeenAt:
          type: string
          format: date-time
          nullable: true
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        [
          id,
          caseId,
          name,
          relationship,
          phone,
          email,
          role,
          accessLevel,
          dispositionTier,
          authorityRecordedAt,
          hasPassword,
          canInvite,
          expiresAt,
          revokedAt,
          firstSeenAt,
          lastSeenAt,
          createdAt,
        ]

    FamilyContactWithLink:
      description: |
        Returned only at the moment a link is minted. `link` is the working
        URL to paste into a text message and is never retrievable again -
        only its digest is stored.
      allOf:
        - $ref: "#/components/schemas/FamilyContact"
        - type: object
          properties:
            link:
              type: string
          required: [link]

    SentLink:
      allOf:
        - $ref: "#/components/schemas/FamilyContactWithLink"
        - type: object
          properties:
            sent:
              type: boolean
            smsError:
              type: string
              nullable: true
              description: Why the text did not go, in words a director can act on.
          required: [sent, smsError]

    FamilyContactInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        relationship:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [next_of_kin, contributor]
        canInvite:
          type: boolean
      required: [name]

    FamilyContactUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        relationship:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [next_of_kin, contributor]
        canInvite:
          type: boolean

    # -------------------------------------------------------------- photos --

    CasePhoto:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: integer
        uploadId:
          type: integer
        uploadedByContactId:
          type: integer
          nullable: true
        uploadedByName:
          type: string
          nullable: true
          description: Who sent it, resolved for display. Null when staff added it.
        caption:
          type: string
          nullable: true
        cropX:
          type: number
          nullable: true
        cropY:
          type: number
          nullable: true
        cropWidth:
          type: number
          nullable: true
        cropHeight:
          type: number
          nullable: true
        position:
          type: integer
        status:
          type: string
          enum: [visible, hidden]
        selected:
          type: boolean
          description: Whether this one runs in the slideshow.
        isPortrait:
          type: boolean
        isReference:
          type: boolean
          description: The photograph given to whoever does hair and cosmetics.
        createdAt:
          type: string
          format: date-time
      required:
        [
          id,
          caseId,
          uploadId,
          uploadedByContactId,
          uploadedByName,
          caption,
          cropX,
          cropY,
          cropWidth,
          cropHeight,
          position,
          status,
          selected,
          isPortrait,
          isReference,
          createdAt,
        ]

    PhotoUpdate:
      type: object
      properties:
        caption:
          type: string
          nullable: true
        status:
          type: string
          enum: [visible, hidden]
        cropX:
          type: number
          minimum: 0
          maximum: 1
        cropY:
          type: number
          minimum: 0
          maximum: 1
        cropWidth:
          type: number
          minimum: 0
          maximum: 1
        cropHeight:
          type: number
          minimum: 0
          maximum: 1

    FamilyPhotoUpdate:
      type: object
      properties:
        caption:
          type: string
          nullable: true
        cropX:
          type: number
          minimum: 0
          maximum: 1
        cropY:
          type: number
          minimum: 0
          maximum: 1
        cropWidth:
          type: number
          minimum: 0
          maximum: 1
        cropHeight:
          type: number
          minimum: 0
          maximum: 1

    PhotoSelectionInput:
      type: object
      properties:
        photoIds:
          type: array
          description: In slideshow order. Anything omitted is deselected.
          items:
            type: integer
      required: [photoIds]

    PhotoIdInput:
      type: object
      properties:
        photoId:
          type: integer
      required: [photoId]

    PhotoOrderInput:
      type: object
      properties:
        photoIds:
          type: array
          items:
            type: integer
      required: [photoIds]

    PortraitInput:
      type: object
      properties:
        photoId:
          type: integer
        cropX:
          type: number
          minimum: 0
          maximum: 1
        cropY:
          type: number
          minimum: 0
          maximum: 1
        cropWidth:
          type: number
          minimum: 0
          maximum: 1
        cropHeight:
          type: number
          minimum: 0
          maximum: 1
      required: [photoId]

    UploadInput:
      type: object
      properties:
        file:
          type: string
          format: binary
      required: [file]

    FamilyPhotoUploadInput:
      type: object
      properties:
        file:
          type: string
          format: binary
        caption:
          type: string
      required: [file]

    CsvUploadInput:
      type: object
      properties:
        file:
          type: string
          format: binary
      required: [file]

    ImportRowIssue:
      type: object
      properties:
        row:
          type: integer
          description: Line number in the file, counting the header as line 1.
        message:
          type: string
      required: [row, message]

    ImportPreviewRow:
      type: object
      properties:
        row:
          type: integer
        decedentName:
          type: string
        serviceAt:
          type: string
          format: date-time
          nullable: true
        contactName:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true
        duplicate:
          type: boolean
          description: A case is already open for this person.
      required: [row, decedentName, serviceAt, contactName, contactPhone, duplicate]

    ImportPreview:
      type: object
      properties:
        headers:
          type: array
          items:
            type: string
        mapping:
          type: object
          additionalProperties:
            type: string
            nullable: true
          description: Which incoming column feeds each of our fields.
        unmapped:
          type: array
          description: Columns we did not recognise. Harmless, but worth seeing.
          items:
            type: string
        totalRows:
          type: integer
        wouldCreate:
          type: integer
        wouldSkip:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportPreviewRow"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowIssue"
      required:
        [headers, mapping, unmapped, totalRows, wouldCreate, wouldSkip, rows, issues]

    ImportResult:
      type: object
      properties:
        created:
          type: integer
        skipped:
          type: integer
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowIssue"
        caseIds:
          type: array
          items:
            type: integer
      required: [created, skipped, issues, caseIds]

    UploadSummary:
      type: object
      properties:
        id:
