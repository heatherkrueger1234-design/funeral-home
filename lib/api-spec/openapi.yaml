          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSummary"

  /uploads/{uploadId}:
    get:
      operationId: getUpload
      tags: [uploads]
      summary: Serve stored bytes
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ---------------------------------------------------------------- family --
  #
  # Everything below is reached with the link token, not a session. None of
  # these paths carry a case id: the token names exactly one case, and a
  # family member has no other case they could be asking for. That is what
  # makes the whole surface safe to expose to an unauthenticated stranger
  # holding a forwarded text message.

  /family/session:
    get:
      operationId: getFamilySession
      tags: [family]
      summary: Who this link belongs to, and everything needed to draw the portal
      description: |
        The first call the portal makes. Returns the home (for branding and
        the urgent number), the person who died, the service details, what is
        outstanding, and the contact the link identifies. A revoked, expired
        or unknown token is a 401 here and the portal shows the "ask the home
        for a new link" screen.
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilySession"

  /family/photos:
    get:
      operationId: getFamilyPhotos
      tags: [family]
      summary: The photographs uploaded so far
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CasePhoto"
    post:
      operationId: uploadFamilyPhoto
      tags: [family]
      summary: Add a photograph to the bin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FamilyPhotoUploadInput"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePhoto"

  /family/photos/{photoId}:
    patch:
      operationId: updateFamilyPhoto
      tags: [family]
      summary: Caption a photograph, or set its portrait crop
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyPhotoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePhoto"
    delete:
      operationId: deleteFamilyPhoto
      tags: [family]
      summary: Remove a photograph this family uploaded
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "204":
          description: Deleted

  /family/reference-photo:
    put:
      operationId: setFamilyReferencePhoto
      tags: [family]
      summary: Choose the photograph showing how they wore their hair and makeup
      description: |
        Handed to whoever prepares them. Deliberately separate from the
        portrait: the portrait is the picture the family loves, which is often
        thirty years old and in profile, and what the preparation room needs
        is a clear recent front-on face.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoIdInput"
      responses:
        "200":
          description: The chosen photograph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePhoto"

  /family/photos/selection:
    put:
      operationId: setFamilyPhotoSelection
      tags: [family]
      summary: Choose which photographs run in the slideshow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoSelectionInput"
      responses:
        "200":
          description: The bin, with the new selection marked
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CasePhoto"

  /family/portrait:
    put:
      operationId: setFamilyPortrait
      tags: [family]
      summary: Choose the main portrait
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortraitInput"
      responses:
        "200":
          description: The chosen photograph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasePhoto"

  /family/obituary:
    get:
      operationId: getFamilyObituary
      tags: [family]
      summary: The obituary form as the family left it
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryDraft"
    put:
      operationId: updateFamilyObituary
      tags: [family]
      summary: Save the obituary fields
      description: |
        Refused once the director has approved the obituary for print, so that
        a well-meaning relative cannot change the text after it has gone to
        the printer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObituaryFieldsInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryDraft"

  /family/obituary/submit:
    post:
      operationId: submitFamilyObituary
      tags: [family]
      summary: Hand the obituary to the director
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObituaryDraft"

  /family/selections:
    get:
      operationId: getFamilySelections
      tags: [family]
      summary: Hymns, readings and pallbearers chosen so far
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceSelection"
    post:
      operationId: createFamilySelection
      tags: [family]
      summary: Add a hymn, reading, or pallbearer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceSelection"

  /family/selections/{selectionId}:
    delete:
      operationId: deleteFamilySelection
      tags: [family]
      summary: Remove a selection the director has not confirmed
      parameters:
        - $ref: "#/components/parameters/SelectionId"
      responses:
        "204":
          description: Deleted

  /family/messages:
    get:
      operationId: getFamilyMessages
      tags: [family]
      summary: The thread with the funeral home
      responses:
        "200":
          description: The thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageThread"
    post:
      operationId: postFamilyMessage
      tags: [family]
      summary: Ask the director something
      description: |
        Always delivered, whatever the hour. When it is sent outside the
        home's office hours the response says so, so the portal can tell the
        family plainly when it will be read and offer the 24-hour line - which
        is a truthful thing to say, unlike holding the message back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMessage"

  /family/deadlines:
    get:
      operationId: getFamilyDeadlines
      tags: [family]
      summary: What is due, and when the service is
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseDeadline"

  /family/deadlines/{deadlineId}:
    post:
      operationId: completeFamilyDeadline
      tags: [family]
      summary: Mark something done, or undo that
      parameters:
        - $ref: "#/components/parameters/DeadlineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteDeadlineInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDeadline"

  /family/aftercare:
    post:
      operationId: setFamilyAftercareConsent
      tags: [family]
      summary: Accept or decline the grief check-ins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AftercareConsentInput"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AftercareEnrollment"

  /family/uploads/{uploadId}:
    get:
      operationId: getFamilyUpload
      tags: [family]
      summary: Serve a photograph on this case, or the home's logo
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

components:
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: integer
    IntakeId:
      name: intakeId
      in: path
      required: true
      schema:
        type: integer
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: integer
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: integer
    SelectionId:
      name: selectionId
      in: path
      required: true
      schema:
        type: integer
    DeadlineId:
      name: deadlineId
      in: path
      required: true
      schema:
        type: integer
    SnippetId:
      name: snippetId
      in: path
      required: true
      schema:
        type: integer
    PrintItemId:
      name: printItemId
      in: path
      required: true
      schema:
        type: integer
    VendorId:
      name: vendorId
      in: path
      required: true
      schema:
        type: integer
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    HealthStatus:
      type: object
      description: |
        Reports on the database, because a process that is up but cannot reach
        Postgres serves errors on every screen -- and a health check that
        answers "ok" to that keeps it in the load balancer.
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: boolean
        mail:
          type: boolean
          description: Whether real email can go out, or is only logged.
        sms:
          type: boolean
          description: Whether family links can actually be texted from here.
      required: [status, database, mail, sms]

    # ---------------------------------------------------------------- auth --

    RegisterInput:
      type: object
      properties:
        homeName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        displayName:
          type: string
          nullable: true
      required: [homeName, email, password]

    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    ForgotPasswordInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ResetPasswordInput:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 10
      required: [token, password]

    StaffMember:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        displayName:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, director, staff]
        deactivatedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, email, displayName, title, role, deactivatedAt]

    TimelineTemplate:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        offsetMinutes:
          type: integer
          description: Relative to the service. Negative is before it.
        offsetLabel:
          type: string
          description: The offset in words, e.g. "3 days before".
        isEvent:
          type: boolean
        enabled:
          type: boolean
        position:
          type: integer
      required:
        [id, title, description, offsetMinutes, offsetLabel, isEvent, enabled, position]

    TimelineTemplateInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        offsetMinutes:
          type: integer
        isEvent:
          type: boolean
      required: [title, offsetMinutes]

    TimelineTemplateUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        offsetMinutes:
          type: integer
        isEvent:
          type: boolean
        enabled:
          type: boolean
        position:
          type: integer

    OnboardingItem:
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        detail:
          type: string
        done:
          type: boolean
      required: [key, title, detail, done]

    Billing:
      type: object
      properties:
        subscriptionStatus:
          type: string
          enum: [trial, active, past_due, canceled]
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        trialDaysLeft:
          type: integer
          nullable: true
        currentPeriodEndsAt:
          type: string
          format: date-time
          nullable: true
        canOpenCases:
          type: boolean
        billingConfigured:
          type: boolean
          description: False when this deployment has no Stripe keys.
        hasSubscription:
          type: boolean
        onboarding:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingItem"
        onboardingComplete:
          type: boolean
      required:
        [
          subscriptionStatus,
          trialEndsAt,
          trialDaysLeft,
          currentPeriodEndsAt,
          canOpenCases,
          billingConfigured,
          hasSubscription,
          onboarding,
          onboardingComplete,
        ]

    BillingReturnInput:
      type: object
      properties:
        returnUrl:
          type: string
          description: Where Stripe sends them back to.
      required: [returnUrl]

    BillingRedirect:
      type: object
      properties:
        url:
          type: string
      required: [url]

    OnboardingStepInput:
      type: object
      properties:
        step:
          type: string
        done:
          type: boolean
      required: [step]

    StaffInviteInput:
      type: object
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, director, staff]
      required: [email]

    StaffMemberWithInvite:
      description: |
        Returned once, when a colleague is added. `inviteLink` is shown to the
        owner so they can pass it on if the email does not arrive; it is the
        ordinary single-use password-reset link and is never retrievable again.
      allOf:
        - $ref: "#/components/schemas/StaffMember"
        - type: object
          properties:
            inviteLink:
              type: string
          required: [inviteLink]

    StaffUpdate:
      type: object
      properties:
        displayName:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, director, staff]
        active:
          type: boolean
          description: False takes their access away without deleting their history.

    AuthUser:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/StaffMember"
        home:
          $ref: "#/components/schemas/FuneralHome"
      required: [user, home]

    # ---------------------------------------------------------------- home --

    FuneralHome:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        logoUploadId:
          type: integer
          nullable: true
        accentColor:
          type: string
        phone:
          type: string
          nullable: true
        urgentPhone:
          type: string
          nullable: true
        addressLine1:
          type: string
          nullable: true
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        officeOpensMinute:
          type: integer
        officeClosesMinute:
          type: integer
        timezone:
          type: string
        aftercareEnabled:
          type: boolean
        aftercareSenderName:
          type: string
          nullable: true
        subscriptionStatus:
          type: string
          enum: [trial, active, past_due, canceled]
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
      required:
        [
          id,
          name,
          slug,
          logoUploadId,
          accentColor,
          phone,
          urgentPhone,
          officeOpensMinute,
          officeClosesMinute,
          timezone,
          aftercareEnabled,
          subscriptionStatus,
        ]

    FuneralHomeUpdate:
      type: object
      properties:
        name:
          type: string
        logoUploadId:
          type: integer
          nullable: true
        accentColor:
          type: string
        phone:
          type: string
          nullable: true
        urgentPhone:
          type: string
          nullable: true
        addressLine1:
          type: string
          nullable: true
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        officeOpensMinute:
          type: integer
          minimum: 0
          maximum: 1439
        officeClosesMinute:
          type: integer
          minimum: 0
          maximum: 1439
        timezone:
          type: string
        aftercareEnabled:
          type: boolean
        aftercareSenderName:
          type: string
          nullable: true

    # ------------------------------------------------------- what a family sees

    PublicFuneralHome:
      type: object
      description: The home as a family may see it - branding and how to reach it.
      properties:
        name:
          type: string
        slug:
          type: string
        accentColor:
          type: string
        logoUploadId:
          type: integer
          nullable: true
        phone:
          type: string
          nullable: true
        urgentPhone:
          type: string
          nullable: true
        addressLine1:
          type: string
          nullable: true
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        intakeEnabled:
          type: boolean
          description: |
            False means this home would rather the first contact were a phone
            call. Show the number instead of the request form.
        officeOpensMinute:
          type: integer
        officeClosesMinute:
          type: integer
        timezone:
          type: string
      required:
        [
          name,
          slug,
          accentColor,
          logoUploadId,
          phone,
          urgentPhone,
          addressLine1,
          addressLine2,
          city,
          region,
          postalCode,
          intakeEnabled,
          officeOpensMinute,
          officeClosesMinute,
          timezone,
        ]

    StaffSignature:
      type: object
      description: A staff member as a family sees them - a name and a title.
      properties:
        displayName:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
      required: [displayName, title]

    # -------------------------------------------------------------- intake --

    IntakeRequestInput:
      type: object
      description: |
        A request from someone nobody has sent a link to. `kind` decides
        everything downstream: `at_need` is a family whose person has died,
        `pre_need` is a living person arranging their own funeral, where the
        requester and the subject are the same and `dateOfDeath` must be
        absent.
      properties:
        homeSlug:
          type: string
          description: Which home is being asked. From the public page's URL.
          minLength: 1
          maxLength: 120
        kind:
          type: string
          enum: [at_need, pre_need]
        requesterName:
          type: string
          minLength: 1
          maxLength: 120
        requesterEmail:
          type: string
          nullable: true
          maxLength: 200
        requesterPhone:
          type: string
          nullable: true
          maxLength: 40
        relationship:
          type: string
          nullable: true
          maxLength: 80
          description: How they are related. Omitted for a pre-need request.
        subjectFirstName:
          type: string
          minLength: 1
          maxLength: 120
        subjectLastName:
          type: string
          minLength: 1
          maxLength: 120
        dateOfDeath:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
          maxLength: 4000
      required: [homeSlug, kind, requesterName, subjectFirstName, subjectLastName]

    IntakeReceipt:
      type: object
      description: |
        Deliberately thin. It confirms the request arrived and repeats what
        the person should do if it cannot wait, and says nothing about the
        home's queue or whether this person is already known to them.
      properties:
        received:
          type: boolean
        kind:
          type: string
          enum: [at_need, pre_need]
        homeName:
          type: string
        urgentPhone:
          type: string
          nullable: true
      required: [received, kind, homeName, urgentPhone]

    DeleteCaseInput:
      type: object
      properties:
        confirmName:
          type: string
          description: |
            The deceased's name exactly as the case shows it. Compared
            case-insensitively and with surrounding space ignored, because
            this is a confirmation and not a spelling test - but it must be
            typed, not clicked.
        reason:
          type: string
          nullable: true
          maxLength: 500
          description: Recorded on the tombstone. For the home's own records.
      required: [confirmName]

    ConvertToAtNeedInput:
      type: object
      properties:
        dateOfDeath:
          type: string
          format: date-time
          description: |
            Required. Converting without one would leave a file that claims
            somebody died on no particular day, and the schedule counts from
            it.
        serviceAt:
          type: string
          format: date-time
          nullable: true
          description: If it is already known. The schedule is built from it.
      required: [dateOfDeath]

    AcceptedIntake:
      allOf:
        - $ref: "#/components/schemas/Case"
        - type: object
          description: |
            The new case, plus the one thing that exists only at this moment.
          properties:
            familyLink:
              type: string
              description: |
                The link to send the person who asked. Returned once and never
                again - the contact row holds only its digest. A director who
                loses it mints a fresh one from the contact, which also stops
                the old one working.
          required: [familyLink]

    IntakeRequest:
      type: object
      description: One request, as the director sees it in their queue.
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [at_need, pre_need]
        status:
          type: string
          enum: [pending, accepted, declined]
        requesterName:
          type: string
        requesterEmail:
          type: string
          nullable: true
        requesterPhone:
          type: string
          nullable: true
        relationship:
          type: string
          nullable: true
        subjectFirstName:
          type: string
        subjectLastName:
          type: string
        subjectDisplayName:
          type: string
        dateOfDeath:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
        caseId:
          type: integer
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        [
          id,
          kind,
          status,
          requesterName,
          requesterEmail,
          requesterPhone,
          relationship,
          subjectFirstName,
          subjectLastName,
          subjectDisplayName,
          dateOfDeath,
          note,
          caseId,
          reviewedAt,
          createdAt,
        ]

    # --------------------------------------------------------------- cases --

    Case:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [at_need, pre_need]
          description: |
            `pre_need` means the person this file is about is still alive and
            arranging their own funeral. Every label, every date and every
            line of condolence has to read this first.
        decedentFirstName:
          type: string
        decedentLastName:
          type: string
        decedentPreferredName:
          type: string
          nullable: true
        displayName:
          type: string
        dateOfBirth:
          type: string
          format: date-time
          nullable: true
        dateOfDeath:
          type: string
