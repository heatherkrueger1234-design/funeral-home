          schema:
            type: string
            enum: [monument, cemetery, casket, urn, clergy, celebrant, florist, musician, caterer, transport, other]
        - name: near
          in: query
          required: false
          description: A US ZIP code to measure from.
          schema:
            type: string
        - name: radiusMiles
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: search
          in: query
