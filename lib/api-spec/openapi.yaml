openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: |
    Holding Today for funeral homes - the calm, private portal a home gives a
    family, and the console the director works it from.

    Two audiences, two authentication schemes, and the split is load-bearing:

    - **Staff** sign in and carry a session cookie. Their funeral home is read
      off their user row; a home id arriving in a request is never trusted.
    - **Families** have no account. They arrive through a link that was texted
      to them and send its token as `Authorization: Bearer <token>`. Every one
      of their endpoints lives under `/family` and is scoped to the single
      case that token belongs to - there is no case id in any of those paths,
      because there is no case they could ask for other than their own.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Liveness
  - name: auth
    description: Staff accounts and sessions
  - name: home
    description: The funeral home's own settings and branding
  - name: cases
    description: Cases - one death, and the work around it
  - name: contacts
    description: The family's people, and their links
  - name: photos
    description: The photo bin
  - name: obituary
    description: The obituary draft
  - name: selections
    description: Hymns, readings, pallbearers
  - name: messages
    description: The one thread per case
  - name: deadlines
    description: What is due, and when
  - name: belongings
    description: Clothing, jewellery, and how they should look
  - name: vendors
    description: The home's local network, and quotes passed through it
  - name: vitals
    description: What the death certificate needs
  - name: catalogue
    description: |
      What a home sells, at the home's own prices. Ships empty: we supply no
      merchandise and set no prices. Also the three price lists the FTC
      Funeral Rule requires a funeral provider to be able to produce.
  - name: orders
    description: |
      What a family chose, and the Statement of Funeral Goods and Services
      Selected that comes out of it. No money moves through any of it.
  - name: billing
    description: Subscription, trial, and the setup checklist
  - name: print
    description: Cards, programs and everything else that gets printed
  - name: aftercare
    description: Branded grief check-ins after the service
  - name: uploads
    description: Serving stored bytes
  - name: family
    description: Everything the family-facing portal calls
  - name: public
    description: |
      The front door, reachable with no credential at all. A home's public
      page, and the request form for the two people nobody has sent a link
      to - a family who found the home themselves, and someone arranging
      their own funeral in advance.
  - name: intake
    description: The director's queue of those requests
  - name: engagement
    description: |
      How a family is getting on, Colorado's own clock on a death, the times
      a home offers a family to choose from, and what a family is left with
      once the service is over. Counting happens here and nowhere else.
  - name: platform
    description: |
      Us, above all the tenants. A separate account, a separate session and a
      separate cookie from any funeral home's staff — see
      `lib/db/src/schema/platform.ts` for why it is not a role on `users`.

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---------------------------------------------------------------- public --

  /public/homes/{slug}:
    get:
      operationId: getPublicHome
      tags: [public]
      summary: The home's public front door
      description: |
        Unauthenticated. Enough to recognise the home and to reach it by
        telephone, and nothing about its account. `intakeEnabled` false means
        the home would rather the first contact were a phone call: show the
        number, not a form.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The home
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFuneralHome"
        "404":
          description: No such home, or it is not taking public requests

  /public/intake:
    post:
      operationId: submitIntakeRequest
      tags: [public]
      summary: Ask a home to open a file
      description: |
        Unauthenticated, and deliberately does not create a case. A stranger
        cannot put a row in a director's case list; this lands in a queue the
        director accepts or declines.

        The response never contains anything about the home beyond what the
        public page already showed, and never confirms whether a person is
        already known to the home.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeRequestInput"
      responses:
        "202":
          description: Received, and waiting for a director
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeReceipt"
        "404":
          description: No such home, or it is not taking public requests
        "429":
          description: Too many requests

  # ------------------------------------------------------------------ auth --

  /auth/register:
    post:
      operationId: registerHome
      tags: [auth]
      summary: Open an account, creating the funeral home and its first owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out on this device
      responses:
        "204":
          description: Signed out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Who is signed in, and which home they work at
      responses:
        "200":
          description: The signed-in staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Send a reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "202":
          description: Accepted, whether or not the address is known

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password from a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "204":
          description: Password changed and other sessions ended

  # ------------------------------------------------------------------ home --

  /home:
    get:
      operationId: getHome
      tags: [home]
      summary: The signed-in staff member's funeral home
      responses:
        "200":
          description: The home
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuneralHome"
    put:
      operationId: updateHome
      tags: [home]
      summary: Update branding, hours and contact details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FuneralHomeUpdate"
      responses:
        "200":
          description: The updated home
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuneralHome"

  /billing:
    get:
      operationId: getBilling
      tags: [billing]
      summary: Where this home stands, and what setup is left
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Billing"

  /billing/checkout:
    post:
      operationId: startCheckout
      tags: [billing]
      summary: Begin a subscription
      description: Returns a Stripe Checkout URL for the browser to open.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingReturnInput"
      responses:
        "200":
          description: Where to send them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRedirect"

  /billing/portal:
    post:
      operationId: openBillingPortal
      tags: [billing]
      summary: Open Stripe's own billing page for cards and invoices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingReturnInput"
      responses:
        "200":
          description: Where to send them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRedirect"

  /home/onboarding:
    post:
      operationId: completeOnboardingStep
      tags: [billing]
      summary: Mark a setup step done, or dismiss it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingStepInput"
      responses:
        "200":
          description: The updated checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Billing"

  /home/staff:
    get:
      operationId: getStaff
      tags: [home]
      summary: Everyone who works cases at this home
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: inviteStaff
      tags: [home]
      summary: Add a colleague, and send them a link to set a password
      description: |
        Owner only. The account is created with no password; the invitee sets
        one through the ordinary reset link, so a password is never typed by
        one person on behalf of another and never travels in an email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInviteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMemberWithInvite"

  /home/staff/{userId}:
    put:
      operationId: updateStaff
      tags: [home]
      summary: Change a colleague's role, or take their access away
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /home/timeline-template:
    get:
      operationId: getTimelineTemplate
      tags: [home]
      summary: The home's standard schedule, as offsets from the service
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineTemplate"
    post:
      operationId: createTimelineTemplate
      tags: [home]
      summary: Add a step to the standard schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineTemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineTemplate"

  /home/timeline-template/{templateId}:
    put:
      operationId: updateTimelineTemplate
      tags: [home]
      summary: Edit a step
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineTemplateUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineTemplate"
    delete:
      operationId: deleteTimelineTemplate
      tags: [home]
      summary: Remove a step
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /cases/{caseId}/deadlines/from-template:
    post:
      operationId: applyTimelineTemplate
      tags: [deadlines]
      summary: Build this case's schedule from the home's standard one
      description: |
        Needs a service date, because every step is an offset from it. Steps
        already on the timeline are matched by title and left alone, so this
        is safe to run twice and safe to run after the service date moves.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The rebuilt timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseDeadline"

  # ---------------------------------------------------------------- intake --

  /cases/{caseId}/export:
    get:
      operationId: exportCase
      tags: [cases]
      summary: Everything on this case, as a folder the home keeps
      description: |
        A zip the home can walk away with: the photographs at full size, the
        obituary as written, the selections, the belongings, the vital
        statistics, the message thread, and a readable summary of the case
        itself. Nothing in it needs this software to open.

        The answer to "what happens to our families' files if we stop paying
        you" is this endpoint, and it keeps working when the subscription has
        lapsed - a home that has cancelled must still be able to take its
        data out, or the product is holding it hostage.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "413":
          description: Too large for one archive

  /cases/{caseId}/at-need:
    post:
      operationId: convertCaseToAtNeed
      tags: [cases]
      summary: The person this pre-need file was for has died
      description: |
        The moment a pre-need file is worth having. Everything they chose
        while well - the photographs, the obituary in their own words, the
        hymns, who carries them - is already here, so nothing is re-typed on
        the day it is hardest to ask.

        Flips the file to `at_need`, records the date of death, and builds the
        standard schedule that a pre-need file deliberately never had. It does
        not invite anybody: who the family is, is a conversation, not a
        field.

        Refused on a file that is already at-need. There is no way back - a
        death is not an editing mistake, and if it really was one, the case
        can be deleted.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertToAtNeedInput"
      responses:
        "200":
          description: The file, now a case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "409":
          description: Already an at-need case

  /cases/{caseId}/delete:
    post:
      operationId: deleteCase
      tags: [cases]
      summary: Erase a case and everything on it, permanently
      description: |
        Not an archive and not a soft delete. The row goes, and every
        photograph, message, obituary draft, belonging and encrypted social
        security number cascades with it. The bytes are gone from the database
        the moment this returns; the only remaining copies are in whatever
        backups the home's deployment keeps, which is why the written
        retention position says so plainly.

        Guarded by typing the name, because a mis-click here destroys the only
        copy of a family's photographs of their mother that exists anywhere.

        What survives is a tombstone: which case, who erased it, when, and
        nothing about who it was for.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteCaseInput"
      responses:
        "204":
          description: Gone
        "400":
          description: The confirmation did not match

  /intake-requests:
    get:
      operationId: getIntakeRequests
      tags: [intake]
      summary: Requests waiting for a director
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, accepted, declined]
      responses:
        "200":
          description: The queue, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntakeRequest"

  /intake-requests/{intakeId}/accept:
    post:
      operationId: acceptIntakeRequest
      tags: [intake]
      summary: Turn a request into a case
      description: |
        Creates the case, carrying the kind across: an at-need request opens
        an ordinary case, a pre-need request opens a file for someone who is
        still alive. The person who asked becomes the first family contact,
        so the link can go straight back to them.
      parameters:
        - $ref: "#/components/parameters/IntakeId"
      responses:
        "201":
          description: The case that now exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedIntake"
        "409":
          description: Already reviewed

  /intake-requests/{intakeId}/decline:
    post:
      operationId: declineIntakeRequest
      tags: [intake]
      summary: Dismiss a request
      description: |
        For a duplicate, a mistake, or a home that will handle it by
        telephone instead. Nothing is sent to the person who asked - a home
        declining a bereaved family's request by automated email would be
        worse than the dead end this feature replaced.
      parameters:
        - $ref: "#/components/parameters/IntakeId"
      responses:
        "200":
          description: The dismissed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeRequest"
        "409":
          description: Already reviewed

  # ----------------------------------------------------------------- cases --

  /cases:
    get:
      operationId: getCases
      tags: [cases]
      summary: The home's cases, soonest service first
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [intake, active, closed]
        - name: search
          in: query
          required: false
          description: Matches the deceased's name, however it was recorded.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseSummary"
    post:
      operationId: createCase
      tags: [cases]
      summary: Open a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"

  /cases/{caseId}:
    get:
      operationId: getCase
      tags: [cases]
      summary: One case, with everything the director needs at a glance
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
    put:
      operationId: updateCase
      tags: [cases]
      summary: Update the person, the service, or the lead director
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"

  /cases/{caseId}/close:
    post:
      operationId: closeCase
      tags: [cases]
      summary: Close the case, lock the thread, and hand the family to aftercare
      description: |
        The commercially important endpoint. Closing sets the date the chat
        locks (a fortnight after the service) and, when the home has aftercare
        switched on, creates a pending enrolment for every family contact who
        left an address. Enrolments stay `pending` until the family consents.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: The closed case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"

  # -------------------------------------------------------------- contacts --

  /cases/{caseId}/contacts:
    get:
      operationId: getCaseContacts
      tags: [contacts]
      summary: The family's people on this case
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FamilyContact"
    post:
      operationId: createCaseContact
      tags: [contacts]
      summary: Add a family member and mint their link
      description: |
        The only time the working link is ever returned. It is shown once, for
        the director to paste into a text message, and cannot be retrieved
        afterwards - only the digest is stored.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyContactInput"
      responses:
        "201":
          description: Created, with the one-time link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyContactWithLink"

  /contacts/{contactId}:
    put:
      operationId: updateContact
      tags: [contacts]
      summary: Correct a name, number or role
      parameters:
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyContactUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyContact"
    delete:
      operationId: revokeContact
      tags: [contacts]
      summary: Revoke this person's link
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "204":
          description: Revoked

  /contacts/{contactId}/send-link:
    post:
      operationId: sendContactLink
      tags: [contacts]
      summary: Text a fresh link to this person's mobile
      description: |
        Mints a new link and sends it, so the previous one stops working. The
        response says whether the text actually went; where the home has no
        SMS credentials it returns the link and `sent: false` so the director
        can send it themselves rather than being told nothing happened.
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: Minted, and sent if possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentLink"

  /contacts/{contactId}/link:
    post:
      operationId: reissueContactLink
      tags: [contacts]
      summary: Mint a fresh link, invalidating the old one
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: The new one-time link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyContactWithLink"

  # ---------------------------------------------------- staff: the asset drop

  /cases/{caseId}/photos:
    get:
      operationId: getCasePhotos
      tags: [photos]
      summary: Every photograph on the case, in slideshow order
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CasePhoto"

  /cases/{caseId}/photos/selection:
    put:
      operationId: setPhotoSelection
      tags: [photos]
      summary: Choose which photographs run in the slideshow
      description: |
        Replaces the selection wholesale and sets its order from the list
        given. Photographs not named are deselected but never deleted -- they
        stay in the bin, because a family's picture of their own mother is not
        something this software throws away for being left out of a slideshow.
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoSelectionInput"
      responses:
        "200":
          description: The bin, with the new selection marked
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CasePhoto"

  /cases/{caseId}/photos/order:
    put:
      operationId: reorderCasePhotos
      tags: [photos]
      summary: Set the slideshow order
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoOrderInput"
      responses:
        "200":
          description: The reordered list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CasePhoto"

  /photos/{photoId}:
    patch:
      operationId: updatePhoto
      tags: [photos]
      summary: Caption, crop, or hide a photograph
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoUpdate"
      responses:
