      required: [status]

    Profile:
      type: object
      properties:
        relationships:
          type: array
          nullable: true
          items:
            type: string
        id:
          type: integer
        childName:
          type: string
        childBirthDate:
          type: string
          nullable: true
        childPassingDate:
          type: string
          nullable: true
        childAge:
          type: string
          nullable: true
        parentName:
          type: string
          nullable: true
        causeOfDeath:
          type: string
          nullable: true
        favoriteColor:
          type: string
          nullable: true
        favoriteFood:
          type: string
          nullable: true
        favoriteAnimal:
          type: string
          nullable: true
        hobbies:
          type: string
          nullable: true
        personality:
          type: string
          nullable: true
        howTheySmelled:
          type: string
          nullable: true
        whatDroveYouCrazy:
          type: string
          nullable: true
        lastHugDate:
          type: string
          nullable: true
        lastWords:
          type: string
          nullable: true
        lastFight:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, childName, createdAt, updatedAt]

    ProfileInput:
      type: object
      properties:
        relationships:
          type: array
          nullable: true
          items:
            type: string
            enum: [child, partner, parent, sibling, friend, other]
        childName:
          type: string
        childBirthDate:
          type: string
          nullable: true
        childPassingDate:
          type: string
          nullable: true
        childAge:
          type: string
          nullable: true
        parentName:
          type: string
          nullable: true
        causeOfDeath:
          type: string
          nullable: true
        favoriteColor:
          type: string
          nullable: true
        favoriteFood:
          type: string
          nullable: true
        favoriteAnimal:
          type: string
          nullable: true
        hobbies:
          type: string
          nullable: true
        personality:
          type: string
          nullable: true
        howTheySmelled:
          type: string
          nullable: true
        whatDroveYouCrazy:
          type: string
          nullable: true
        lastHugDate:
          type: string
          nullable: true
        lastWords:
          type: string
          nullable: true
        lastFight:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
      required: [childName]

    Memory:
      type: object
      properties:
        isStarred:
          type: boolean
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        dateTaken:
          type: string
          nullable: true
        tags:
          type: string
          nullable: true
        isAiGenerated:
          type: boolean
        createdAt:
          type: string
      required: [id, title, isAiGenerated, createdAt]

    MemoryInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        dateTaken:
          type: string
          nullable: true
        tags:
          type: string
          nullable: true
        isAiGenerated:
          type: boolean
      required: [title]

    JournalEntry:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        mood:
          type: string
