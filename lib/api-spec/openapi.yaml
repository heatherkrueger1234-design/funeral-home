    # ------------------------------------------------------------ messages --

    CaseMessage:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: integer
        body:
          type: string
        authorSide:
          type: string
          enum: [home, family]
          description: |
            Which side wrote it, derived on the server from which author
            column is set rather than stored, so the two cannot disagree.
        authorName:
          type: string
          nullable: true
        authorTitle:
          type: string
          nullable: true
        sentOutsideOfficeHours:
          type: boolean
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        [
          id,
          caseId,
          body,
          authorSide,
          authorName,
          authorTitle,
          sentOutsideOfficeHours,
          readAt,
          createdAt,
        ]

    MessageThread:
      type: object
      description: |
        The thread plus the state the UI needs to say something honest about
        it: whether it is locked, and whether a message written now would land
        outside office hours.
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CaseMessage"
        locked:
          type: boolean
        lockedAt:
          type: string
          format: date-time
          nullable: true
        withinOfficeHours:
          type: boolean
        officeOpensMinute:
          type: integer
        officeClosesMinute:
          type: integer
        timezone:
          type: string
        urgentPhone:
          type: string
          nullable: true
      required:
        [
          messages,
          locked,
          lockedAt,
          withinOfficeHours,
          officeOpensMinute,
          officeClosesMinute,
          timezone,
          urgentPhone,
        ]

    MessageInput:
      type: object
      properties:
        body:
          type: string
          minLength: 1
      required: [body]

