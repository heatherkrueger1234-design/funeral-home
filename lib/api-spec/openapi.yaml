          type: string
          nullable: true
        funeralDetails:
          type: string
          nullable: true
        memorialDetails:
          type: string
          nullable: true
        speechNotes:
          type: string
          nullable: true
        burialLocation:
          type: string
          nullable: true
        funeralHome:
          type: string
          nullable: true
        funeralDate:
          type: string
          nullable: true
        funeralCost:
          type: string
          nullable: true

    Todo:
