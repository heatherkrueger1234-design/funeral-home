      type: object
      properties:
        title:
          type: string
        content:
          type: string
        type:
          type: string
          enum: [poem, song, art, other]
        mediaUrl:
          type: string
          nullable: true
      required: [title, content, type]

    Document:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
          nullable: true
        category:
          type: string
          enum: [medical, legal, financial, funeral, passwords, autopsy, other]
        fileUrl:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        documentDate:
          type: string
          nullable: true
        isPrivate:
          type: boolean
        contentHidden:
          type: boolean
          description: >-
            True when this document is marked private and its content and
            notes were withheld from a list response. Fetch the document by
            id to read them.
        contentUnreadable:
          type: boolean
          description: >-
            True when this document's stored content could not be decrypted.
            The record is shown rather than hidden, so the loss is visible
            instead of silent.
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, title, category, isPrivate, createdAt, updatedAt]

