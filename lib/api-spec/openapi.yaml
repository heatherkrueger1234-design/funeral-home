      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Belonging"
    delete:
      operationId: deleteBelonging
      tags: [belongings]
      summary: Remove an item logged in error
      parameters:
        - name: belongingId
          in: path
          required: true
