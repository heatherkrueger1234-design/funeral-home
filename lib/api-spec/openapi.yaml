        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        [
          id,
          caseId,
          body,
          authorSide,
          authorName,
          authorTitle,
          sentOutsideOfficeHours,
          readAt,
          createdAt,
        ]

    MessageThread:
      type: object
      description: |
        The thread plus the state the UI needs to say something honest about
        it: whether it is locked, and whether a message written now would land
        outside office hours.
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CaseMessage"
        locked:
          type: boolean
        lockedAt:
          type: string
          format: date-time
          nullable: true
        withinOfficeHours:
          type: boolean
        officeOpensMinute:
          type: integer
        officeClosesMinute:
          type: integer
        timezone:
          type: string
        urgentPhone:
          type: string
          nullable: true
      required:
        [
          messages,
          locked,
          lockedAt,
          withinOfficeHours,
          officeOpensMinute,
          officeClosesMinute,
          timezone,
          urgentPhone,
        ]

    MessageInput:
      type: object
      properties:
        body:
          type: string
          minLength: 1
      required: [body]

    # ----------------------------------------------------------- deadlines --

    CaseDeadline:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        dueAt:
          type: string
          format: date-time
        isEvent:
          type: boolean
        completedAt:
          type: string
          format: date-time
          nullable: true
        completedByName:
          type: string
          nullable: true
        position:
          type: integer
      required:
        [id, caseId, title, description, dueAt, isEvent, completedAt, completedByName, position]

    DeadlineInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        dueAt:
          type: string
          format: date-time
        isEvent:
          type: boolean
      required: [title, dueAt]

    DeadlineUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        dueAt:
          type: string
          format: date-time
        isEvent:
          type: boolean
        completed:
          type: boolean
        position:
          type: integer

    CompleteDeadlineInput:
      type: object
      properties:
        completed:
          type: boolean
      required: [completed]

    # ----------------------------------------------------------- aftercare --

    AftercareEnrollment:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: integer
        contactId:
          type: integer
        contactName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        brandedAs:
          type: string
        status:
          type: string
          enum: [pending, active, done]
        startsAt:
          type: string
          format: date-time
        consentedAt:
          type: string
          format: date-time
          nullable: true
        unsubscribedAt:
          type: string
          format: date-time
          nullable: true
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/AftercareDelivery"
      required:
        [
          id,
          caseId,
          contactId,
          contactName,
          email,
          phone,
          brandedAs,
          status,
          startsAt,
          consentedAt,
          unsubscribedAt,
          deliveries,
        ]

    AftercareDelivery:
      type: object
      properties:
        id:
          type: integer
        dayOffset:
          type: integer
        dueAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
        failedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, dayOffset, dueAt, sentAt, failedAt]

    AftercareConsentInput:
      type: object
      properties:
        consent:
          type: boolean
        email:
          type: string
          nullable: true
      required: [consent]

    # -------------------------------------------------------------- family --

    FamilySession:
      type: object
      description: |
        Everything the family portal needs on first load, in one call - the
        portal is opened on a phone, on mobile data, at a kitchen table, and
        four round trips before anything renders is four chances to look
        broken.
      properties:
        contact:
          $ref: "#/components/schemas/FamilyContact"
        home:
          $ref: "#/components/schemas/PublicFuneralHome"
        case:
          $ref: "#/components/schemas/Case"
        leadDirector:
          oneOf:
            - $ref: "#/components/schemas/StaffSignature"
            - type: "null"
        photoCount:
          type: integer
        photoLimit:
          type: integer
        selectedPhotoCount:
          type: integer
        slideshowTarget:
          type: integer
          description: A recommendation for a watchable slideshow, never enforced.
        obituaryStatus:
          type: string
          enum: [family_draft, submitted, approved]
        outstandingDeadlines:
          type: integer
        unreadMessages:
          type: integer
        messagesLocked:
          type: boolean
        aftercare:
          oneOf:
            - $ref: "#/components/schemas/AftercareEnrollment"
            - type: "null"
      required:
        [
          contact,
          home,
          case,
          leadDirector,
          photoCount,
          photoLimit,
          selectedPhotoCount,
          slideshowTarget,
          obituaryStatus,
          outstandingDeadlines,
          unreadMessages,
          messagesLocked,
          aftercare,
        ]

    PlatformAdmin:
      description: |
        One of us. Never a funeral home's staff member — a different table, a
        different session and a different cookie, so that neither resolver can
        ever return the other kind of account.
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, support]
          description: |
            `support` can look but not change. It exists so that helping a
            funeral home does not require the ability to suspend one.
        hasPassword:
          type: boolean
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, email, displayName, role, hasPassword, lastSeenAt, createdAt]

    PlatformLoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    FamilyPasswordInput:
      type: object
      properties:
        password:
          type: string
          minLength: 10
          description: |
            Long enough to be worth having, short enough that somebody can
            choose a passphrase they will actually recall on the worst week of
            their life.
        currentPassword:
          type: string
          nullable: true
          description: Required when replacing an existing password.
      required: [password]

    ContactAccessInput:
      type: object
      properties:
        accessLevel:
          type: string
          enum: [viewing, arranging]
          description: |
            `authorizing` is deliberately absent. Raising somebody to it is
            recording a legal determination, so it goes through the authority
            endpoint, which requires saying what the determination was.
      required: [accessLevel]

    ContactAuthorityInput:
      type: object
      properties:
        dispositionTier:
          type: string
          minLength: 1
          description: |
            Which tier of the statutory priority order this person was found to
            hold, in the director's own words.
      required: [dispositionTier]

    IssuedPassword:
      description: |
        Shown once, at the moment it is set, and never retrievable again —
        only the hash is kept. The director reads it out or hands it over.
      type: object
      properties:
        password:
          type: string
      required: [password]

    DispositionDisputeInput:
      type: object
      properties:
        disputed:
          type: boolean
        note:
          type: string
          nullable: true
          description: For the home's own record. Never shown to the family.
      required: [disputed]

    # ------------------------------------------------- storefront schemas --
    #
    # Prices are integer cents throughout. Every number here is added to other
    # numbers and printed on a document the Funeral Rule requires to be
    # accurate, and floating point gets that wrong by a cent often enough to
    # matter — a cent wrong on a statement is a telephone call the director
    # should not have to take.

    CatalogueSection:
      type: string
      description: |
        Which statutory price list a category's items print on. Fixed rather
        than named by the home, because these are the Rule's own divisions and
        a home that invents a fourth one has a price list that does not comply.
        What the home names is the category.
      enum:
        - services
        - caskets
        - outer_burial_containers
        - merchandise
        - cash_advance

    ItemAvailability:
      type: string
      description: |
        `by_request` is the honest answer for the casket a home will order in
        but does not keep. Deliberately not "out of stock": a family reading
        that about their mother's casket hears a shop.
      enum: [available, by_request]

    ArchivedInstead:
      description: |
        Returned in place of a 204 when the row could not be deleted because a
        family has already chosen from it. A statement is a document the home
        handed across a desk, and it does not get to change.
      type: object
      properties:
        archived:
          type: boolean
      required: [archived]

    DisclosureSlot:
      description: |
        A disclosure the Funeral Rule requires on a General Price List. The
        slot is ours; the words are the home's. The Rule prescribes what each
        must convey and a home's counsel signs off on how it is said.
      type: object
      properties:
        key:
          type: string
        title:
          type: string
        note:
          type: string
          description: What the Rule requires this to convey, in plain English.
      required: [key, title, note]

    StorefrontSettings:
      type: object
      properties:
        gplEffectiveOn:
          type: string
          format: date-time
          nullable: true
          description: |
            The date printed on the price lists, and the switch that turns the
            storefront on. Until it is set the home has no General Price List,
            and no family is shown a casket.
        hasGeneralPriceList:
          type: boolean
        disclosures:
          type: object
          additionalProperties:
            type: string
          description: The home's own wording, by slot key. Blank slots are not printed.
        priceListFootnote:
          type: string
          nullable: true
        paymentPageUrl:
          type: string
          nullable: true
          description: |
            The home's own payment page, at the home's own processor. A link,
            not an integration. Nothing in this product takes money from a
            family.
        paymentInstructions:
          type: string
          nullable: true
          description: The other ways the home takes money, in the home's own words.
        disclosureSlots:
          type: array
          items:
            $ref: "#/components/schemas/DisclosureSlot"
      required:
        [
          gplEffectiveOn,
          hasGeneralPriceList,
          disclosures,
          priceListFootnote,
          paymentPageUrl,
          paymentInstructions,
          disclosureSlots,
        ]

    StorefrontSettingsUpdate:
      type: object
      properties:
        gplEffectiveOn:
          type: string
          format: date-time
          nullable: true
        disclosures:
          type: object
          additionalProperties:
            type: string
        priceListFootnote:
          type: string
          nullable: true
        paymentPageUrl:
          type: string
          maxLength: 500
          pattern: "^https://\\S+$"
          nullable: true
          description: |
            Send null to clear it. A payment link under a funeral home's name
            that is not even encrypted has no business existing, so the scheme
            is part of the contract rather than a check one client remembers.
        paymentInstructions:
          type: string
          nullable: true

    CatalogueItem:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        itemCode:
          type: string
          nullable: true
          description: The home's own reference, so a re-import updates rather than duplicates.
        priceCents:
          type: integer
        priceUnit:
          type: string
          nullable: true
          description: '"each", "per day", "per mile". Printed beside the price, never parsed.'
        photoUploadId:
          type: integer
          nullable: true
        availability:
          $ref: "#/components/schemas/ItemAvailability"
        position:
          type: integer
        archivedAt:
          type: string
          format: date-time
          nullable: true
      required:
        [
          id,
          categoryId,
          name,
          description,
          itemCode,
          priceCents,
          priceUnit,
          photoUploadId,
          availability,
          position,
          archivedAt,
        ]

    CatalogueCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        section:
          $ref: "#/components/schemas/CatalogueSection"
        position:
          type: integer
        archivedAt:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueItem"
      required: [id, name, description, section, position, archivedAt, items]

    CataloguePackage:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        priceCents:
          type: integer
        itemisedTotalCents:
          type: integer
          description: |
            What the same items come to bought one at a time. Always sent
            alongside the package price, never instead of it — a package that
            is the only price on offer is the thing the Rule forbids.
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueItem"
      required: [id, name, description, priceCents, itemisedTotalCents, items]

    Catalogue:
      type: object
      properties:
        hasGeneralPriceList:
          type: boolean
        gplEffectiveOn:
          type: string
          format: date-time
          nullable: true
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueCategory"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/CataloguePackage"
      required: [hasGeneralPriceList, gplEffectiveOn, categories, packages]

    CatalogueCategoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 400
          nullable: true
        section:
          $ref: "#/components/schemas/CatalogueSection"
      required: [name, section]

    CatalogueCategoryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 400
          nullable: true
        section:
          $ref: "#/components/schemas/CatalogueSection"
        position:
          type: integer
          minimum: 0
        archived:
          type: boolean

    CatalogueItemInput:
      type: object
      properties:
        categoryId:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          nullable: true
        itemCode:
          type: string
          maxLength: 100
          nullable: true
        priceCents:
          type: integer
          minimum: 0
          maximum: 1000000000
        priceUnit:
          type: string
          maxLength: 40
          nullable: true
        photoUploadId:
          type: integer
          nullable: true
        availability:
          $ref: "#/components/schemas/ItemAvailability"
      required: [categoryId, name, priceCents]

    CatalogueItemUpdate:
      type: object
      properties:
        categoryId:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          nullable: true
        itemCode:
          type: string
          maxLength: 100
          nullable: true
        priceCents:
          type: integer
          minimum: 0
          maximum: 1000000000
        priceUnit:
          type: string
          maxLength: 40
          nullable: true
        photoUploadId:
          type: integer
          nullable: true
        availability:
          $ref: "#/components/schemas/ItemAvailability"
        position:
          type: integer
          minimum: 0
        archived:
          type: boolean

    CataloguePackageInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 1000
          nullable: true
        priceCents:
          type: integer
          minimum: 0
          maximum: 1000000000
        itemIds:
          type: array
          minItems: 1
          maxItems: 60
          items:
            type: integer
      required: [name, priceCents, itemIds]

    CataloguePackageUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 1000
          nullable: true
        priceCents:
          type: integer
          minimum: 0
          maximum: 1000000000
        itemIds:
          type: array
          minItems: 1
          maxItems: 60
          items:
            type: integer
        archived:
          type: boolean

    CatalogueImportInput:
      type: object
      properties:
        file:
          type: string
          format: binary
        sections:
          type: string
          description: |
            JSON object mapping each of the home's own category names to the
            price list it belongs on, as corrected by the director in the
            preview. A category left out keeps the guess.
      required: [file]

    CatalogueImportCategory:
      description: One of the home's own category names, and where we think it goes.
      type: object
      properties:
        name:
          type: string
        section:
          $ref: "#/components/schemas/CatalogueSection"
        itemCount:
          type: integer
      required: [name, section, itemCount]

    CatalogueImportRow:
      type: object
      properties:
        row:
          type: integer
          description: The line number a spreadsheet shows, so "row 34" means row 34.
        categoryName:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        priceCents:
          type: integer
        itemCode:
          type: string
          nullable: true
      required: [row, categoryName, name, description, priceCents, itemCode]

    CatalogueImportPreview:
      type: object
      properties:
        headers:
          type: array
          items:
            type: string
        mapping:
          type: object
          additionalProperties:
            type: string
            nullable: true
        totalRows:
          type: integer
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueImportCategory"
        wouldCreate:
          type: integer
        wouldUpdate:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueImportRow"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowIssue"
      required:
        [
          headers,
          mapping,
          totalRows,
          categories,
          wouldCreate,
          wouldUpdate,
          rows,
          issues,
        ]

    CatalogueImportResult:
      type: object
      properties:
        created:
          type: integer
        updated:
          type: integer
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowIssue"
      required: [created, updated, issues]

    SelectionLineKind:
      type: string
      description: |
        `family_provided` is the one that matters legally: that line carries no
        price, because a provider may not charge for handling a casket or urn
        bought elsewhere. `package_adjustment` is the only line that may be
        negative, because it is the only one that is a discount.
      enum: [item, family_provided, package_adjustment]

    MerchandiseSelectionLine:
      type: object
      properties:
        id:
          type: integer
        kind:
          $ref: "#/components/schemas/SelectionLineKind"
        catalogueItemId:
          type: integer
          nullable: true
        packageId:
          type: integer
          nullable: true
        name:
          type: string
          description: |
            Snapshotted when the line was written, not joined at render time.
            A home raising its prices in March must not rewrite what a family
            agreed in February.
        description:
          type: string
          nullable: true
        section:
          type: string
          nullable: true
        unitPriceCents:
          type: integer
          nullable: true
          description: Null on a family-provided line. There is no fee on that path.
        quantity:
          type: integer
        lineTotalCents:
          type: integer
        notes:
          type: string
          nullable: true
        position:
          type: integer
      required:
        [
          id,
          kind,
          catalogueItemId,
          packageId,
          name,
          description,
          section,
          unitPriceCents,
          quantity,
          lineTotalCents,
          notes,
          position,
        ]

    MerchandiseSelection:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [draft, confirmed]
        gplShownAt:
          type: string
          format: date-time
          nullable: true
          description: When this family was given the General Price List.
        gplEffectiveOn:
          type: string
          format: date-time
          nullable: true
          description: Which price list these numbers came from.
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        settledAt:
          type: string
          format: date-time
          nullable: true
          description: |
            A note about the home's own books, never a receipt from us. We
            process no payments, so we do not know.
        settledNote:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        lines:
          type: array
          items:
            $ref: "#/components/schemas/MerchandiseSelectionLine"
        totalCents:
          type: integer
        updatedAt:
          type: string
          format: date-time
      required:
        [
          id,
          status,
          gplShownAt,
          gplEffectiveOn,
          confirmedAt,
          settledAt,
          settledNote,
          notes,
          lines,
          totalCents,
          updatedAt,
        ]

    PaymentHandoff:
      description: |
        Where a family is told to send the money, which is never to us. Null on
        a pre-need plan and null on a draft. There is no amount in this shape
        and never will be: we process nothing, so we know nothing, and a field
        called `amountPaid` would be a lie with a type annotation.
      type: object
      properties:
        url:
          type: string
          nullable: true
        host:
          type: string
          nullable: true
          description: Shown beside the link so nobody is surprised by where it goes.
        instructions:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          description: The number to ring when there is no link, which is not an error.
      required: [url, host, instructions, phone]

    Storefront:
      type: object
      properties:
        hasGeneralPriceList:
          type: boolean
        gplEffectiveOn:
          type: string
          format: date-time
          nullable: true
        casketsUnlocked:
          type: boolean
          description: |
            Whether caskets and outer burial containers are showing. False
            until the home has a dated price list and this family has it.
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueCategory"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/CataloguePackage"
        selection:
          $ref: "#/components/schemas/MerchandiseSelection"
        payment:
          allOf:
            - $ref: "#/components/schemas/PaymentHandoff"
          nullable: true
        mayDiscussPayment:
          type: boolean
          description: False on a pre-need case. Nothing is owed on a plan.
      required:
        [
          hasGeneralPriceList,
          gplEffectiveOn,
          casketsUnlocked,
          categories,
          packages,
          selection,
          payment,
          mayDiscussPayment,
        ]

    SelectionItemInput:
      type: object
      additionalProperties: false
      properties:
        itemId:
          type: integer
        quantity:
          type: integer
          minimum: 1
          maximum: 99
      required: [itemId]

    SelectionPackageInput:
      type: object
      additionalProperties: false
      properties:
        packageId:
          type: integer
      required: [packageId]

    FamilyProvidedInput:
      description: |
        What the family is bringing, and optionally who is bringing it and
        when. No price, and no field to put one in.

        `additionalProperties: false` here means what it says: a client that
        tries to attach a fee to a third-party casket is refused outright
        rather than having the field quietly ignored. The generator does not
        carry that through to the validator, so the server re-applies it —
        see `assertNoExtraKeys` in `lib/storefront.ts`.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 500
          nullable: true
      required: [name]

    SelectionLineUpdate:
      type: object
      additionalProperties: false
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        notes:
          type: string
          maxLength: 500
          nullable: true

    MerchandiseSelectionUpdate:
      type: object
      additionalProperties: false
      properties:
        notes:
          type: string
          maxLength: 4000
          nullable: true
        confirmed:
          type: boolean
        settled:
          type: boolean
          description: |
            A director reading their own books. Refused on a pre-need case,
            where nothing is owed and nothing is collected.
        settledNote:
          type: string
          maxLength: 500
          nullable: true

    # --------------------------------------------------------- engagement --

    ContactEngagement:
      type: object
      description: |
        One family member, and whether the link we sent them ever landed.
        `linkOpened` false almost always means a wrong number rather than a
        family ignoring anybody, which is why the console says so.
      properties:
        contactId:
          type: integer
        name:
          type: string
        role:
          type: string
        hasPhone:
          type: boolean
        linkOpened:
          type: boolean
        firstSeenAt:
          type: string
          format: date-time
          nullable: true
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        photographs:
          type: integer
        messages:
          type: integer
      required:
        [contactId, name, role, hasPhone, linkOpened, photographs, messages]

    CaseAttention:
      type: object
      description: |
        Something a director might want to act on, in a sentence written to
        survive being read aloud. Never a score, never a colour, never a count
        of what a family has failed to do.
      properties:
        key:
          type: string
        sentence:
          type: string
      required: [key, sentence]

    CaseEngagement:
      type: object
      properties:
        caseId:
          type: integer
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/ContactEngagement"
        linksCreated:
          type: integer
        linksOpened:
          type: integer
        photographs:
          type: integer
        photographsSelected:
          type: integer
        messagesFromFamily:
          type: integer
        obituaryStatus:
          type: string
          nullable: true
        vitalsStatus:
          type: string
          nullable: true
        storefrontStatus:
          type: string
          nullable: true
        timelineOutstanding:
          type: integer
        timelineDone:
          type: integer
        aftercareEnrolled:
          type: integer
        aftercareConsented:
          type: integer
        aftercareUnsubscribed:
          type: integer
        attention:
          type: array
          items:
            $ref: "#/components/schemas/CaseAttention"
      required:
        [
          caseId,
          contacts,
          linksCreated,
          linksOpened,
          photographs,
          photographsSelected,
          messagesFromFamily,
          timelineOutstanding,
          timelineDone,
          aftercareEnrolled,
          aftercareConsented,
          aftercareUnsubscribed,
          attention,
        ]

    HomeEngagement:
      type: object
      description: |
        One home's totals. The same computation the platform admin console
        aggregates across every home -- there is one counting implementation
        in this codebase and this is its shape.
      properties:
        casesOpened:
          type: integer
        casesActive:
          type: integer
        familyLinksCreated:
          type: integer
        familyLinksOpened:
          type: integer
        photographs:
          type: integer
        aftercareEnrolled:
          type: integer
        aftercareConsented:
          type: integer
        aftercareDeclined:
          type: integer
          description: |
            Enrolled, never said yes, has not asked to stop. Mostly the
            family that simply did not answer, which is most of them.
        aftercareUnsubscribed:
          type: integer
        familiesContributing:
          type: integer
        messagesFromFamily:
          type: integer
        formsCompleted:
          type: integer
        obituariesApproved:
          type: integer
        storefrontSelections:
          type: integer
        slotsOffered:
          type: integer
        slotsTaken:
          type: integer
      required:
        [
          casesOpened,
          casesActive,
          familyLinksCreated,
          familyLinksOpened,
          photographs,
          aftercareEnrolled,
          aftercareConsented,
          aftercareDeclined,
          aftercareUnsubscribed,
          familiesContributing,
          messagesFromFamily,
          formsCompleted,
          obituariesApproved,
          storefrontSelections,
          slotsOffered,
          slotsTaken,
        ]

    CaseAttentionSummary:
      type: object
      properties:
        caseId:
          type: integer
        displayName:
          type: string
        status:
          type: string
        serviceAt:
          type: string
          format: date-time
          nullable: true
        attention:
          type: array
          items:
            $ref: "#/components/schemas/CaseAttention"
      required: [caseId, displayName, status, attention]

    HomeEngagementReport:
      type: object
      properties:
        home:
          $ref: "#/components/schemas/HomeEngagement"
        cases:
          type: array
          description: Open cases with something worth a look, soonest service first.
          items:
            $ref: "#/components/schemas/CaseAttentionSummary"
      required: [home, cases]

    StatutoryClock:
      type: object
      description: |
        The two dates only a director knows. `custodyAssumed` is true while
        the date is our proposal -- the moment the case was opened -- rather
        than something a person confirmed.
      properties:
        custodyTakenAt:
          type: string
          format: date-time
          nullable: true
        custodyAssumed:
          type: boolean
        edrsRequestedAt:
          type: string
          format: date-time
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
      required: [custodyAssumed]

    StatutoryClockInput:
      type: object
      additionalProperties: false
      properties:
        custodyTakenAt:
          type: string
          format: date-time
          nullable: true
        edrsRequestedAt:
          type: string
          format: date-time
          nullable: true

    StatutoryDeadline:
      type: object
      properties:
        id:
          type: integer
        caseId:
          type: integer
        key:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        citation:
          type: string
          nullable: true
        anchor:
          type: string
          enum: [custody, edrs_request, death, disposition]
        dueAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        notApplicableAt:
          type: string
          format: date-time
          nullable: true
        notApplicableReason:
          type: string
          nullable: true
        standing:
          type: string
          enum:
            [
              done,
              not_applicable,
              before_disposition,
              no_date_yet,
              ahead,
              soon,
              passed,
            ]
        standingLabel:
          type: string
          description: |
            The standing in words, written once here so that every screen says
            the same sentence and no screen renders it as a number going red.
      required: [id, caseId, key, title, anchor, standing, standingLabel]

    StatutoryDeadlineUpdate:
      type: object
      additionalProperties: false
      properties:
        completed:
          type: boolean
        notApplicable:
          type: boolean
        notApplicableReason:
          type: string
          maxLength: 300
          nullable: true

    StatutorySchedule:
      type: object
      properties:
        clock:
          $ref: "#/components/schemas/StatutoryClock"
        deadlines:
          type: array
          items:
            $ref: "#/components/schemas/StatutoryDeadline"
      required: [clock, deadlines]

    AppointmentSlot:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [arrangement, viewing, drop_off, collection, other]
        label:
          type: string
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        location:
          type: string
          nullable: true
        takenByContactId:
          type: integer
          nullable: true
        takenByName:
          type: string
          nullable: true
        takenAt:
          type: string
          format: date-time
          nullable: true
        withdrawnAt:
          type: string
          format: date-time
          nullable: true
        isMine:
          type: boolean
          description: Taken by this case. The one the family is holding.
      required: [id, kind, label, startsAt, durationMinutes, isMine]

    SlotOfferInput:
      type: object
      additionalProperties: false
      description: |
        The home defines the options. There is no endpoint that takes a date
        a family typed, because a date nobody read is how a family ends up
        outside a locked chapel.
      properties:
        slots:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            properties:
              kind:
                type: string
                enum: [arrangement, viewing, drop_off, collection, other]
              label:
                type: string
                minLength: 1
                maxLength: 120
              startsAt:
                type: string
                format: date-time
              durationMinutes:
                type: integer
                minimum: 5
                maximum: 480
              location:
                type: string
                maxLength: 200
                nullable: true
            required: [label, startsAt]
      required: [slots]

    SlotNoticeInput:
      type: object
      additionalProperties: false
      properties:
        contactIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: integer
      required: [contactIds]

    SlotNoticeResult:
      type: object
      properties:
        sent:
          type: array
          items:
            type: object
            properties:
              contactId:
                type: integer
              name:
                type: string
            required: [contactId, name]
        notSent:
          type: array
          description: |
            Who was not written to, and why, in words a director can act on.
            Missing consent is the usual reason and the fix is a phone call.
          items:
            type: object
            properties:
              contactId:
                type: integer
              name:
                type: string
              reason:
                type: string
            required: [contactId, name, reason]
      required: [sent, notSent]

    MessagingConsentState:
      type: object
      properties:
        contactId:
          type: integer
          nullable: true
        name:
          type: string
          nullable: true
        channel:
          type: string
          enum: [sms, email]
        address:
          type: string
        granted:
          type: boolean
        grantedAt:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          nullable: true
        sourceDetail:
          type: string
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revokedReason:
          type: string
          nullable: true
      required: [channel, address, granted]

    MessagingConsentInput:
      type: object
      additionalProperties: false
      properties:
        contactId:
          type: integer
        channel:
          type: string
          enum: [sms, email]
        sourceDetail:
          type: string
          maxLength: 300
          description: |
            What was actually said, in the director's own words. Shown back to
            them later, because "we have consent" is not a defence.
      required: [contactId]

    FamilyMessagingConsentInput:
      type: object
      additionalProperties: false
      properties:
        consent:
          type: boolean
        channel:
          type: string
          enum: [sms, email]
      required: [consent]

    KeepsakePhoto:
      type: object
      properties:
        id:
          type: integer
        uploadId:
          type: integer
          nullable: true
        caption:
          type: string
          nullable: true
        selected:
          type: boolean
      required: [id, selected]

    KeepsakeDocument:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        kind:
          type: string
      required: [id, title, kind]

    KeepsakeCheckIn:
      type: object
      properties:
        id:
          type: integer
        dayOffset:
          type: integer
        dueAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
      required: [id, dayOffset, dueAt]

    Keepsake:
      type: object
      description: |
        What is left once everyone has gone home. Built inside this product
        and never a handoff to another one.
      properties:
        phase:
          type: string
          enum: [arranging, keeping]
          description: |
            `keeping` once the service has happened or the case is closed:
            the working surfaces recede and this is what the portal shows.
        displayName:
          type: string
        serviceAt:
          type: string
          format: date-time
          nullable: true
        serviceLocation:
          type: string
          nullable: true
        obituary:
          type: string
          nullable: true
          description: The approved text, or null while it is still a draft.
        photos:
          type: array
          items:
            $ref: "#/components/schemas/KeepsakePhoto"
        documents:
          type: array
          description: The order of service and anything else shared with the family.
          items:
            $ref: "#/components/schemas/KeepsakeDocument"
        checkIns:
          type: array
          items:
            $ref: "#/components/schemas/KeepsakeCheckIn"
        checkInsStatus:
          type: string
          nullable: true
          enum: [pending, active, done, null]
      required: [phase, displayName, photos, documents, checkIns]
