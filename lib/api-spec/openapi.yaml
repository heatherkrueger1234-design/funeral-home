openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Holding Today - a private place for bereaved parents
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: memories
    description: Photo memories and memory wall
  - name: journal
    description: Journal entries
  - name: letters
    description: Letters to and from child
  - name: creative
    description: Creative works - poems, songs, art
  - name: documents
    description: Important documents and records
  - name: quotes
    description: Favorite quotes and songs
  - name: tribute
    description: Obituary, speeches, memorials
  - name: todos
    description: To-do lists
  - name: affirmations
    description: Daily affirmations
  - name: milestones
    description: Timeline milestones and memories
  - name: stories
    description: Shared community stories and memories
  - name: profile
    description: Child profile and details
  - name: signs
    description: Signs and visits
  - name: belongings
    description: Who has what of theirs
  - name: gifts
    description: What arrived, and the thank-you cards
  - name: contacts
    description: People who need to be told
  - name: obituaries
    description: Obituary drafts
  - name: memorial
    description: Memorial planning choices
  - name: keepsakes
    description: Answers to the small questions
  - name: guides
    description: Searching the written guides
  - name: community
    description: The one shared room
  - name: shares
    description: Read-only public links
  - name: auth
    description: Accounts, sessions and personal-data controls
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get child profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Update child profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /memories:
    get:
      operationId: getMemories
      tags: [memories]
      summary: Get all memories
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
    post:
      operationId: createMemory
      tags: [memories]
      summary: Create a memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"

  /memories/{id}:
    put:
      operationId: updateMemory
      tags: [memories]
      summary: Update a memory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
    delete:
      operationId: deleteMemory
      tags: [memories]
      summary: Delete a memory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /journal:
    get:
      operationId: getJournalEntries
      tags: [journal]
      summary: Get all journal entries
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [journal]
      summary: Create journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal/{id}:
    put:
      operationId: updateJournalEntry
      tags: [journal]
      summary: Update journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
    delete:
      operationId: deleteJournalEntry
      tags: [journal]
      summary: Delete journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /letters:
    get:
      operationId: getLetters
      tags: [letters]
      summary: Get all letters
      parameters:
        - name: direction
          in: query
          schema:
            type: string
            enum: [to_child, from_child, received]
      responses:
        "200":
          description: List of letters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Letter"
    post:
      operationId: createLetter
      tags: [letters]
      summary: Create a letter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LetterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Letter"

  /letters/{id}:
    put:
      operationId: updateLetter
      tags: [letters]
      summary: Update a letter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LetterInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Letter"
    delete:
      operationId: deleteLetter
      tags: [letters]
      summary: Delete a letter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /creative:
    get:
      operationId: getCreativeWorks
      tags: [creative]
      summary: Get all creative works
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [poem, song, art, other]
      responses:
        "200":
          description: List of creative works
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreativeWork"
    post:
      operationId: createCreativeWork
      tags: [creative]
      summary: Create creative work
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreativeWorkInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeWork"

  /creative/{id}:
    put:
      operationId: updateCreativeWork
      tags: [creative]
      summary: Update creative work
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreativeWorkInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeWork"
    delete:
      operationId: deleteCreativeWork
      tags: [creative]
      summary: Delete creative work
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /documents:
    get:
      operationId: getDocuments
      tags: [documents]
      summary: Get all documents
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [medical, legal, financial, funeral, passwords, autopsy, other]
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create a document record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Read one document, including content hidden from the list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    put:
      operationId: updateDocument
      tags: [documents]
      summary: Update a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /quotes:
    get:
      operationId: getQuotes
      tags: [quotes]
      summary: Get quotes and songs
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [quote, song, both]
      responses:
        "200":
          description: List of quotes and songs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoteSong"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Add a quote or song
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteSongInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteSong"

  /quotes/{id}:
    delete:
      operationId: deleteQuote
      tags: [quotes]
      summary: Delete a quote or song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tribute:
    get:
      operationId: getTribute
      tags: [tribute]
      summary: Get tribute information
      responses:
        "200":
          description: Tribute info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tribute"
    put:
      operationId: updateTribute
      tags: [tribute]
      summary: Update tribute information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TributeInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tribute"

  /todos:
    get:
      operationId: getTodos
      tags: [todos]
      summary: Get all todos
      responses:
        "200":
          description: List of todos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
    post:
      operationId: createTodo
      tags: [todos]
      summary: Create a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"

  /todos/{id}:
    put:
      operationId: updateTodo
      tags: [todos]
      summary: Update a todo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
    delete:
      operationId: deleteTodo
      tags: [todos]
      summary: Delete a todo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /affirmations:
    get:
      operationId: getAffirmations
      tags: [affirmations]
      summary: Get all affirmations
      responses:
        "200":
          description: List of affirmations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Affirmation"
    post:
      operationId: createAffirmation
      tags: [affirmations]
      summary: Create an affirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffirmationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Affirmation"

  /affirmations/{id}:
    delete:
      operationId: deleteAffirmation
      tags: [affirmations]
      summary: Delete an affirmation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /milestones:
    get:
      operationId: getMilestones
      tags: [milestones]
      summary: Get timeline milestones
      responses:
        "200":
          description: List of milestones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Milestone"
    post:
      operationId: createMilestone
      tags: [milestones]
      summary: Create a milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"

  /milestones/{id}:
    put:
      operationId: updateMilestone
      tags: [milestones]
      summary: Update a milestone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
    delete:
      operationId: deleteMilestone
      tags: [milestones]
      summary: Delete a milestone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /stories:
    get:
      operationId: getStories
      tags: [stories]
      summary: Get all shared stories
      responses:
        "200":
          description: List of stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Story"
    post:
      operationId: createStory
      tags: [stories]
      summary: Share a story
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"

  /stories/{id}:
    delete:
      operationId: deleteStory
      tags: [stories]
      summary: Delete a story
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Signed out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The signed-in account, if any
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not signed in

  /auth/password:
    put:
      operationId: changePassword
      tags: [auth]
      summary: Change password and sign out every other device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Password changed

  /auth/methods:
    get:
      operationId: getAuthMethods
      tags: [auth]
      summary: Which ways of signing in this deployment offers
      responses:
        "200":
          description: Available sign-in methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMethods"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Send a password reset link
      description: >-
        Always succeeds, whether or not an account exists for that address.
        Answering differently would turn this into a way to discover who has
        an account here, which for this application means discovering who has
        lost a child.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "204":
          description: Accepted

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using a emailed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "204":
          description: Password set

  /auth/export:
    get:
      operationId: exportMyData
      tags: [auth]
      summary: Download everything this account has written
      responses:
        "200":
          description: Export bundle
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /auth/account:
    delete:
      operationId: deleteAccount
      tags: [auth]
      summary: Permanently delete this account and all of its data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountInput"
      responses:
        "204":
          description: Deleted


  /signs:
    get:
      operationId: getSigns
      tags: [signs]
      summary: List signs
      responses:
        "200":
          description: Signs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sign"
    post:
      operationId: createSign
      tags: [signs]
      summary: Record a sign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sign"

  /signs/{id}:
    put:
      operationId: updateSign
      tags: [signs]
      summary: Update a sign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sign"
    delete:
      operationId: deleteSign
      tags: [signs]
      summary: Remove a sign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /belongings:
    get:
      operationId: getBelongings
      tags: [belongings]
      summary: List their belongings
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Belonging"
    post:
      operationId: createBelonging
      tags: [belongings]
      summary: Add one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BelongingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Belonging"

  /belongings/{id}:
    put:
      operationId: updateBelonging
      tags: [belongings]
      summary: Update one
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BelongingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Belonging"
    delete:
      operationId: deleteBelonging
      tags: [belongings]
      summary: Remove one
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /gifts:
    get:
      operationId: getGifts
      tags: [gifts]
      summary: List gifts received
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gift"
    post:
      operationId: createGift
      tags: [gifts]
      summary: Add one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiftInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gift"

  /gifts/{id}:
    put:
      operationId: updateGift
      tags: [gifts]
      summary: Update one
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiftUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gift"
    delete:
      operationId: deleteGift
      tags: [gifts]
      summary: Remove one
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
