# The public website's headers. security-headers.conf's, minus the one that
# would defeat the point (X-Robots-Tag: noindex), and with a tighter policy,
# because this page runs no script and has no inline style at all.
#
# Included in every location for the reason security-headers.conf gives:
# nginx drops inherited add_header lines in any location that sets its own.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
