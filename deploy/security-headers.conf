# The security headers every response from this server carries.
#
# In a file of its own, and included rather than inherited, because of the
# single most surprising rule in nginx: `add_header` directives are inherited
# by a `location` only if that location declares **no `add_header` of its
# own**. The moment one appears, every header set further up is dropped.
#
# This server has three locations that each set a header for their own
# reasons — a content type on the liveness probe, and a Cache-Control on the
# assets and on index.html. All three were therefore being served with no
# X-Frame-Options, no nosniff and no Referrer-Policy, which is to say: the
# HTML document that *is* the application, and every script and stylesheet it
# loads. The headers were only ever reaching the paths that did not need them
# most. `include` restores them one block at a time, which is the only
# mechanism nginx offers.
#
# Add a header here and it applies everywhere; add one to a location and
# remember to include this file beside it.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;

# No Referer at all. strict-origin-when-cross-origin, which this was, sends a
# page's whole address with every request to its own origin, and addresses
# here are credentials: a family's /f/<token>, and the ?token= of every reset,
# invitation and confirmation link. Every script, stylesheet and font such a
# page loaded, and the call that redeems an emailed token, went out with it as
# the Referer -- into nginx's error log and Caddy's when a request failed, and
# on a host without this file into the host's. Each index.html says the same
# in a meta tag, read from this line (see the policy at the end).
add_header Referrer-Policy no-referrer always;

# The header form of the <meta name="robots"> tag in each index.html. The
# meta tag only covers the HTML document; this also covers the scripts, the
# favicon and anything else a crawler reaches directly.
add_header X-Robots-Tag "noindex, nofollow" always;

# TLS is terminated in front of this server (see DEPLOY.md), so this process
# never sees a plain HTTP request to redirect — but the header still has to
# come from here, because HSTS only takes effect once a browser has received
# it at least once. Without it, every first visit (and every visit after a
# cleared cache) is one stripped-HTTPS redirect away from being downgraded.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# The policy. A served header is the best place for it -- it covers the
# document before a single byte of it is parsed -- but not every host serves
# this file. Replit's static hosting, where both live deployments are, sends
# no headers at all, and appends its own analytics script to the end of every
# page, which reports each page's address: a family's address is their link.
# So each app's build also writes this policy into its index.html as a meta
# tag, read from this line by deploy/security-meta.ts, and that is what
# refuses the script there. Change it here and nowhere else; an app picks the
# change up when it is next built, which building its image does.
#
# Behind nginx a page therefore carries the policy twice. Both copies are
# enforced, and that is harmless only because they are the same one.
#
# Notes on the parts that are not simply 'self':
#
#   style-src   'unsafe-inline' is required and is not laziness. The family
#               portal paints the funeral home's own colour as an inline
#               style attribute on the header, which is what white-labelling
#               means here, and CSP has no way to allow one attribute.
#   font-src    'self' only. Lora and Source Sans 3 are bundled with each
#               app (@fontsource-variable) rather than fetched from Google
#               Fonts, so no third party learns who opened a family's
#               portal, and the first paint no longer waits on two extra
#               origins. data: stays for fonts a component inlines.
#   img-src     blob: is load-bearing. A family's photographs cannot be
#               fetched by a plain <img>, because the family surface is
#               gated by a bearer token that an <img> has nowhere to put --
#               so they are fetched as bytes and handed to the browser as
#               object URLs. Drop blob: and every photograph disappears.
#   frame-src   blob: for the same reason as img-src. A proof the home has
#               shared ("Things to check") is fetched with the family's
#               bearer token and shown in an iframe from an object URL;
#               without frame-src the frame falls back to default-src
#               'self', which never matches blob:, and every proof rendered
#               as an empty box in production while working in development.
#   frame-ancestors  The same intent as X-Frame-Options above, for browsers
#               that have moved on from it. Both are kept. Header only: a
#               browser ignores it in a meta tag, so the page's copy leaves
#               it out.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
