# The security headers every response from this server carries.
#
# In a file of its own, and included rather than inherited, because of the
# single most surprising rule in nginx: `add_header` directives are inherited
# by a `location` only if that location declares **no `add_header` of its
# own**. The moment one appears, every header set further up is dropped.
#
# This server has three locations that each set a header for their own
# reasons — a content type on the liveness probe, and a Cache-Control on the
# assets and on index.html. All three were therefore being served with no
# X-Frame-Options, no nosniff and no Referrer-Policy, which is to say: the
# HTML document that *is* the application, and every script and stylesheet it
# loads. The headers were only ever reaching the paths that did not need them
# most. `include` restores them one block at a time, which is the only
# mechanism nginx offers.
#
# Add a header here and it applies everywhere; add one to a location and
# remember to include this file beside it.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# TLS is terminated in front of this server (see DEPLOY.md), so this process
# never sees a plain HTTP request to redirect — but the header still has to
# come from here, because HSTS only takes effect once a browser has received
# it at least once. Without it, every first visit (and every visit after a
# cleared cache) is one stripped-HTTPS redirect away from being downgraded.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# The policy the nginx config has always claimed the frontend shipped, and
# which the frontend did not in fact ship: there is no CSP meta tag in any of
# the three index.html files. A served header is the better place for it
# anyway — it covers the document before a single byte of it is parsed.
#
# Notes on the parts that are not simply 'self':
#
#   style-src   'unsafe-inline' is required and is not laziness. The family
#               portal paints the funeral home's own colour as an inline
#               style attribute on the header, which is what white-labelling
#               means here, and CSP has no way to allow one attribute.
#   font-src    Lora and Source Sans 3 are served by Google Fonts; the
#               stylesheet that names them comes from fonts.googleapis.com
#               and the font files themselves from fonts.gstatic.com.
#   img-src     blob: is load-bearing. A family's photographs cannot be
#               fetched by a plain <img>, because the family surface is
#               gated by a bearer token that an <img> has nowhere to put --
#               so they are fetched as bytes and handed to the browser as
#               object URLs. Drop blob: and every photograph disappears.
#   frame-ancestors  The same intent as X-Frame-Options above, for browsers
#               that have moved on from it. Both are kept.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
