# The headers for `/api/`, which differ from security-headers.conf in one
# respect: framing.
#
# `/api/` used to inherit the server-level headers, including
# `X-Frame-Options DENY` and a CSP with `frame-ancestors 'none'`. Two things
# this API serves are meant to be framed by the application on the same
# origin -- the print proof the director previews in the case's Print tab,
# and the proof a family approves -- and both are loaded into an `<iframe>`
# straight from `/api/.../render`. Under DENY the browser refuses to draw
# them, so in production the preview was an empty box while every local run,
# which has no nginx in front, looked fine.
#
# Same-origin framing only. The HTML routes set their own
# Content-Security-Policy (see `sendRenderedHtml` in routes/print.ts), which
# is why none is added here: nginx would append a second policy, and every
# policy present is enforced, so the stricter server-wide one would win.
# helmet already sends `X-Frame-Options: SAMEORIGIN`; the value here matches
# it, so the two headers cannot disagree.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
